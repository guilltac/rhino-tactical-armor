========================= */

.producto-admin img{

.producto-admin h3{

.producto-admin p{

.acciones-producto{

.btn-editar,

.btn-editar{

.btn-eliminar{

.btn-editar:hover{

}

.btn-eliminar:hover{

.cargando{

@media(max-width:600px){

    }

        flex:1;
    }

<script>

    const URL_SERVIDOR =
    "https://script.google.com/macros/s/AKfycbw5LfmoztRCz4AMONfpoPYPL8uqcalm4OrOSMXgzW0IRFccgAfXvdCIYJySEZMV94pO0g/exec";

    let categoriasDisponibles = [];

    function valorCategoria(nombre,id){
        const n=String(nombre||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
        const conocidos={
            "novedades":"novedades",
            "botas":"botas",
            "equipo tactico":"tactico",
            "uniformes":"uniformes",
            "aph":"aph",
            "promociones":"promo",
            "uniformes reacondicionados":"reacondicionados",
            "zona de relevo":"relevo",
            "varios":"varios",
            "tecnologia y comunicacion":"tecnologia"
        };
        return conocidos[n] || ("cat_"+String(id||"").toLowerCase());
    }

    async function cargarCategoriasProducto(){
        const principal=document.getElementById("categoriaPrincipal");
        const adicionales=document.getElementById("categoriasAdicionales");
        try{
            const body=new URLSearchParams({
                accion:"listarCategorias",
                tokenAdmin:sessionStorage.getItem("tokenAdmin")||""
            });
            const respuesta=await fetch(URL_SERVIDOR,{method:"POST",body});
            const resultado=await respuesta.json();
            if(!resultado.autorizado){
                window.location.replace("admin.html");
                return;
            }
            if(!resultado.ok)throw new Error(resultado.mensaje||"No se pudieron cargar las categorías.");

            categoriasDisponibles=(resultado.categorias||[])
                .filter(c=>String(c.estado||"").toUpperCase()==="ACTIVA")
                .sort((a,b)=>(Number(a.orden)||0)-(Number(b.orden)||0));

            const principales=categoriasDisponibles.filter(c=>
                String(c.puede_ser_principal||"NO").toUpperCase()==="SI" &&
                /^[A-Z]{3}$/.test(String(c.prefijo||"").toUpperCase())
            );

            principal.innerHTML='<option value="">Selecciona una categoría principal</option>'+
                principales.map(c=>
                    '<option value="'+escHtml(c.id)+'">'+
                    escHtml((c.icono?c.icono+" ":"")+c.nombre+" ("+c.prefijo+")")+
                    '</option>'
                ).join("");

            adicionales.innerHTML=categoriasDisponibles.map(c=>{
                const valor=valorCategoria(c.nombre,c.id);
                return '<label class="category-option">'+
                    '<input type="checkbox" class="categoria-adicional" value="'+escHtml(valor)+'" data-id="'+escHtml(c.id)+'"> '+
                    escHtml((c.icono?c.icono+" ":"")+c.nombre)+
                    '</label>';
            }).join("");
        }catch(error){
            principal.innerHTML='<option value="">Error al cargar categorías</option>';
            adicionales.innerHTML='<div style="color:#8b1e1e;">'+escHtml(error.message)+'</div>';
        }
    }

    function escHtml(valor){
        return String(valor??"").replace(/[&<>"']/g,function(m){
            return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];
        });
    }

    function subirFotoDrive_PRUEBA(archivo) {
        
alert("LA FUNCIÓN DE SUBIDA SE ESTÁ EJECUTANDO");
    
        return new Promise(function(resolve, reject) {

        if (!archivo) {

            resolve("");

            return;

        }

        const estadoFoto =
            document.getElementById("estadoFoto");

        estadoFoto.textContent =
            "📷 Preparando fotografía...";

        const lector =
            new FileReader();

        lector.onload = function(e) {

            try {

                const resultado =
                    e.target.result;

                const partes =
                    resultado.split(",");

                const base64 =
                    partes[1];

                const tipoArchivo =
                    archivo.type ||
                    "image/jpeg";

                const nombreArchivo =
                    Date.now() +
                    "_" +
                    archivo.name;

                estadoFoto.textContent =
                    "📤 Subiendo fotografía...";

                /*
                 * Por ahora utilizamos una petición
                 * directa al Web App.
                 */

                fetch(
                    URL_SERVIDOR,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            "accion=subirImagen" +
                            "&base64=" +
                            encodeURIComponent(base64) +
                            "&nombreArchivo=" +
                            encodeURIComponent(nombreArchivo) +
                            "&tipoArchivo=" +
                            encodeURIComponent(tipoArchivo)

                    }

                )
                .then(function(respuesta){

                    return respuesta.text();

                })

                .then(function(resultado){

                    alert(
    "RESPUESTA DEL SERVIDOR:\n\n" +
    texto
);

console.log(
    "Respuesta:",
    texto
);

                    estadoFoto.textContent =
                        "📤 Respuesta recibida.";

                    resolve(resultado);

                })

                .catch(function(error){

                    estadoFoto.textContent =
                        "❌ Error al subir fotografía.";

                    reject(error);

                });

            } catch(error) {

                reject(error);

            }

        };

        lector.onerror =
            function(error){

                reject(error);

            };

        lector.readAsDataURL(archivo);

    });

}

function subirFotoDrive(archivo) {

    return new Promise(function(resolve, reject) {

        if (!archivo) {

            resolve("");

            return;

        }

        const lector =
            new FileReader();

        const estado =
            document.getElementById(
                "estadoFoto"
            );

        estado.textContent =
            "📷 Preparando fotografía...";

        lector.onload =
            function(e) {

                const partes =
                    e.target.result.split(",");

                const base64 =
                    partes[1];

                estado.textContent =
                    "📤 Subiendo fotografía...";

                fetch(
                    URL_SERVIDOR,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/x-www-form-urlencoded"

                        },

                        body:

                            "accion=subirImagen" +

                            "&base64=" +
                            encodeURIComponent(base64) +

                            "&nombreArchivo=" +
                            encodeURIComponent(
                                Date.now() +
                                "_" +
                                archivo.name
                            ) +

                         "&tipoArchivo=" +
encodeURIComponent(
    archivo.type
) +

"&tokenAdmin=" +
encodeURIComponent(
    sessionStorage.getItem("tokenAdmin") || ""
)

                    }
                )

                .then(function(respuesta){

                    return respuesta.text();

                })

                .then(function(texto){

                    console.log(
                        "Respuesta:",
                        texto
                    );

                    const resultado =
                        JSON.parse(texto);

                    if(!resultado.ok){

                        throw new Error(
                            resultado.error ||
                            "No se pudo subir la imagen."
                        );

                    }

                    estado.textContent =
                        "✅ Fotografía guardada correctamente.";

                   resolve(
    "https://drive.google.com/uc?export=view&id=" +
    resultado.id
);

                })

                .catch(function(error){

                    console.error(
                        "Error al subir imagen:",
                        error
                    );

                    estado.textContent =
                        "❌ No se pudo guardar la fotografía.";

                    reject(error);

                });

            };

        lector.onerror =
            function(){

                reject(
                    new Error(
                        "No se pudo leer la fotografía."
                    )
                );

            };

        lector.readAsDataURL(archivo);

    });

}
    
async function guardarProducto(){

    const nombre =
        document
        .getElementById("nombre")
        .value
        .trim();

    const precio =
        document
        .getElementById("precio")
        .value;

    const stock =
        document
        .getElementById("stock")
        .value;

    const descripcion =
        document
        .getElementById("descripcion")
        .value
        .trim();

    const descripcionDetallada =
    document
    .getElementById("descripcionDetallada")
    .value
    .trim();
    
    const estado =
        document
        .getElementById("estado")
        .value;

  const foto =
    document
    .getElementById("foto")
    .files[0];

const foto2 =
    document
    .getElementById("foto2")
    .files[0];

const foto3 =
    document
    .getElementById("foto3")
    .files[0];

const foto4 =
    document
    .getElementById("foto4")
    .files[0];

const foto5 =
    document
    .getElementById("foto5")
    .files[0];

    const categoriaPrincipal =
        document.getElementById("categoriaPrincipal").value;

    const categorias =
        Array.from(
            document.querySelectorAll(
                '.categoria-adicional:checked'
            )
        )
        .map(function(categoria){
            return categoria.value;
        })
        .join(",");

    if(
        nombre === "" ||
        precio === "" ||
        stock === "" ||
        categoriaPrincipal === ""
    ){

        alert(
            "Completa nombre, precio, stock y categoría principal."
        );

        return;

    }

    const mensaje =
        document.getElementById(
            "mensaje"
        );

    const estadoFoto =
        document.getElementById(
            "estadoFoto"
        );

    /* =========================
       SUBIR FOTOGRAFÍA
       ========================= */

    let urlFoto = "";
    let urlFoto2 = "";
    let urlFoto3 = "";
    let urlFoto4 = "";
    let urlFoto5 = "";

    if(foto){

        try {

            estadoFoto.textContent =
                "📤 Subiendo fotografía...";

            urlFoto =
    await subirFotoDrive(
        foto
    );

        } catch(error) {

            console.error(
                error
            );

            alert(
                "No se pudo guardar la fotografía."
            );

            return;

        }

    }
    if(foto2){

    try {

        estadoFoto.textContent =
            "📤 Subiendo fotografía 2...";

        urlFoto2 =
            await subirFotoDrive(foto2);

    } catch(error) {

        console.error(error);

        alert(
            "No se pudo guardar la fotografía 2."
        );

        return;
    }
}

if(foto3){

    try {

        estadoFoto.textContent =
            "📤 Subiendo fotografía 3...";

        urlFoto3 =
            await subirFotoDrive(foto3);

    } catch(error) {

        console.error(error);

        alert(
            "No se pudo guardar la fotografía 3."
        );

        return;
    }
}

if(foto4){

    try {

        estadoFoto.textContent =
            "📤 Subiendo fotografía 4...";

        urlFoto4 =
            await subirFotoDrive(foto4);

    } catch(error) {

        console.error(error);

        alert(
            "No se pudo guardar la fotografía 4."
        );

        return;
    }
}

if(foto5){

    try {

        estadoFoto.textContent =
            "📤 Subiendo fotografía 5...";

        urlFoto5 =
            await subirFotoDrive(foto5);

    } catch(error) {

        console.error(error);

        alert(
            "No se pudo guardar la fotografía 5."
        );

        return;
    }
}

    /* =========================
       DATOS DEL PRODUCTO
       ========================= */

    const datos = {

    id: "",

    categoriaPrincipal: categoriaPrincipal,

    nombre: nombre,

    precio: precio,

    stock: stock,

    descripcion: descripcion,
        
    descripcionDetallada: descripcionDetallada,

    categorias: categorias,

    estado: estado,

    foto: urlFoto,

    foto2: urlFoto2,

    foto3: urlFoto3,

    foto4: urlFoto4,

    foto5: urlFoto5,

        tokenAdmin:
    sessionStorage.getItem("tokenAdmin") || ""

};

    /* =========================
       ENVIAR PRODUCTO
       ========================= */

    try{
        const cuerpo=new URLSearchParams();
        Object.keys(datos).forEach(function(campo){
            cuerpo.append(campo,datos[campo]);
        });

        const respuesta=await fetch(URL_SERVIDOR,{
            method:"POST",
            body:cuerpo
        });

        const texto=await respuesta.text();
        let resultado;
        try{
            resultado=JSON.parse(texto);
        }catch(e){
            throw new Error(texto||"Respuesta no válida del servidor.");
        }

        if(resultado.autorizado===false){
            window.location.replace("admin.html");
            return;
        }

        if(!resultado.ok){
            throw new Error(resultado.mensaje||"No se pudo guardar el producto.");
        }

        mensaje.innerHTML =
            "✅ PRODUCTO REGISTRADO CORRECTAMENTE<br><br>" +
            "🏷️ Código asignado: <strong>" + escHtml(resultado.id) + "</strong><br>" +
            "📦 Producto: " + escHtml(nombre) + "<br>" +
            "💰 Precio: Bs " + escHtml(precio) + "<br>" +
            "📦 Stock: " + escHtml(stock) + "<br>" +
            (urlFoto ? "📷 Fotografía guardada en Drive" : "📷 Sin fotografía");

        mensaje.style.display="block";
    }catch(error){
        console.error(error);
        alert("No se pudo guardar el producto: "+error.message);
        return;
    }

    /* =========================
       LIMPIAR FORMULARIO
       ========================= */

    document
    .getElementById("nombre")
    .value = "";

    document
    .getElementById("precio")
    .value = "";

    document
    .getElementById("stock")
    .value = "";

    document
    .getElementById("descripcion")
    .value = "";

    document
    .getElementById("descripcionDetallada")
    .value = "";

    document
    .getElementById("categoriaPrincipal")
    .value = "";

    document
    .getElementById("estado")
    .value =
        "activo";

    ["foto", "foto2", "foto3", "foto4", "foto5"]
    .forEach(function(idFoto){

        const campoFoto =
            document.getElementById(idFoto);

        if (campoFoto) {
            campoFoto.value = "";
        }

    });

    estadoFoto.textContent =
        "";

    document
    .querySelectorAll(
        '.categoria-adicional'
    )
    .forEach(function(caja){

        caja.checked = false;

    });

}

cargarCategoriasProducto();
