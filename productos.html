<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GUILLTAC - Productos</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
    color:#222;
}

header{
    background:#111;
    color:white;
    padding:20px;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:6px 0 0;
    color:#ccc;
}

main{
    max-width:900px;
    margin:30px auto;
    padding:0 20px;
}

.formulario{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

h2{
    margin-top:0;
}

.grupo{
    margin-bottom:18px;
}

.grupo label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.categorias{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
}

.category-option{
    border:1px solid #ccc;
    padding:12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:normal !important;
}

.category-option input{
    width:auto;
    margin-right:8px;
}

button{
    width:100%;
    padding:14px;
    background:#111;
    color:white;
    border:0;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#333;
}

.volver{
    display:inline-block;
    margin-bottom:20px;
    color:#111;
    text-decoration:none;
    font-weight:bold;
}

.volver:hover{
    text-decoration:underline;
}

.mensaje{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    background:#e8f5e9;
    color:#176b2c;
    text-align:center;
    font-weight:bold;
}
/* =========================
   LISTA DE PRODUCTOS ADMIN
========================= */

.lista-admin{
    margin-top:25px;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.lista-titulo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.lista-titulo h2{
    margin:0;
}

.btn-actualizar{
    width:auto;
    padding:9px 15px;
    background:#315f24;
}

.btn-actualizar:hover{
    background:#24491a;
}

.producto-admin{
    display:grid;
    grid-template-columns:70px 1fr auto;
    align-items:center;
    gap:15px;

    padding:12px 0;
    border-bottom:1px solid #ddd;
}

.producto-admin:last-child{
    border-bottom:0;
}

.producto-admin img{
    width:65px;
    height:65px;
    object-fit:cover;
    border-radius:6px;
    background:#eee;
}

.producto-admin h3{
    margin:0 0 5px;
    font-size:16px;
}

.producto-admin p{
    margin:3px 0;
    font-size:13px;
    color:#666;
}

.acciones-producto{
    display:flex;
    gap:6px;
}

.btn-editar,
.btn-eliminar{
    width:auto;
    padding:8px 10px;
    font-size:12px;
}

.btn-editar{
    background:#315f24;
}

.btn-eliminar{
    background:#8b1e1e;
}

.btn-editar:hover{
    background:#24491a;
}

.btn-eliminar:hover{
    background:#641414;
}

.cargando{
    color:#777;
    text-align:center;
}


/* CELULAR */

@media(max-width:600px){

    .lista-admin{
        padding:15px;
    }

    .producto-admin{
        grid-template-columns:55px 1fr;
    }

    .producto-admin img{
        width:50px;
        height:50px;
    }

    .acciones-producto{
        grid-column:1 / -1;
    }

    .acciones-producto button{
        flex:1;
    }

}
</style>

</head>


<body>

<script>

if (!sessionStorage.getItem("tokenAdmin")) {

    window.location.replace("admin.html");

}

</script>

<header>

<h1>RHINO TACTICAL ARMOR</h1>

<p>Administración de productos</p>

</header>


<main>

<a
href="admin.html"
class="volver"
>
← Volver al panel
</a>


<section class="formulario">

<h2 id="tituloFormulario">Agregar producto</h2>

<div class="grupo">

<label for="nombre">
Nombre del producto
</label>

<input
type="text"
id="nombre"
placeholder="Ej. Bota Táctica Urbana"
>

</div>


<div class="grupo">

<label for="precio">
Precio (Bs)
</label>

<input
type="number"
id="precio"
min="0"
step="0.01"
placeholder="0"
>

</div>


<div class="grupo">

<label for="stock">
Stock
</label>

<input
type="number"
id="stock"
min="0"
placeholder="0"
>

</div>


<div class="grupo">

<label for="estado">
Estado
</label>

<select id="estado">

<option value="activo">
Activo
</option>

<option value="agotado">
Agotado
</option>

</select>

</div>


<div class="grupo">

<label for="descripcion">
Descripción
</label>

<textarea
id="descripcion"
placeholder="Descripción del producto..."
></textarea>

</div>

<div class="grupo">

<label for="descripcionDetallada">
Descripción detallada
</label>

<textarea
id="descripcionDetallada"
placeholder="Describe detalladamente el producto: materiales, medidas, tallas, colores, características técnicas, compatibilidad, contenido, recomendaciones, etc."
style="min-height:180px;"
></textarea>

</div>
    
<div class="grupo">

<label>
Categorías
</label>


<div class="categorias">


<label class="category-option">

<input
type="checkbox"
value="novedades"
>

Novedades

</label>


<label class="category-option">

<input
type="checkbox"
value="botas"
>

Botas

</label>


<label class="category-option">

<input
type="checkbox"
value="tactico"
>

Equipo Táctico

</label>


<label class="category-option">

<input
type="checkbox"
value="uniformes"
>

Uniformes

</label>


<label class="category-option">

<input
type="checkbox"
value="aph"
>

APH

</label>


<label class="category-option">

<input
type="checkbox"
value="promo"
>

Promociones

</label>


<label class="category-option">

<input
type="checkbox"
value="reacondicionados"
>

Uniformes Reacondicionados

</label>


<label class="category-option">

<input
type="checkbox"
value="relevo"
>

Zona de Relevo

</label>


<label class="category-option">

<input
type="checkbox"
value="varios"
>

Varios

</label>


</div>

<div class="grupo">

<label for="foto">
Fotografía principal
</label>

<div style="
    display:flex;
    align-items:center;
    gap:8px;
">

    <input
        type="file"
        id="foto"
        accept="image/*"
        style="flex:1;"
    >

    <button
        type="button"
        onclick="quitarFoto('foto')"
        title="Quitar fotografía"
        style="
            width:44px;
            min-width:44px;
            padding:12px 5px;
            background:#8b1e1e;
            font-size:15px;
        "
    >
        ❌
    </button>

    
</div>


<div class="grupo">

<label for="foto2">
Fotografía adicional 2
</label>

<input
type="file"
id="foto2"
accept="image/*"
>

</div>


<div class="grupo">

<label for="foto3">
Fotografía adicional 3
</label>

<input
type="file"
id="foto3"
accept="image/*"
>

</div>


<div class="grupo">

<label for="foto4">
Fotografía adicional 4
</label>

<input
type="file"
id="foto4"
accept="image/*"
>

</div>


<div class="grupo">

<label for="foto5">
Fotografía adicional 5
</label>

<input
type="file"
id="foto5"
accept="image/*"
>

</div>


<div
    id="estadoFoto"
    style="
        margin-top:8px;
        margin-bottom:18px;
        font-size:13px;
    "
></div>


<button
type="button"
onclick="guardarProducto()"
>

Guardar producto

</button>


<div
id="mensaje"
class="mensaje"
>
Producto enviado correctamente.
</div>


</section>

<section class="lista-admin">

    <div class="lista-titulo">
        <h2>Productos registrados</h2>

        <button
            type="button"
            class="btn-actualizar"
            onclick="cargarProductosAdmin()"
        >
            ↻ Actualizar
        </button>
    </div>

    <div id="listaProductosAdmin">

        <p class="cargando">
            Cargando productos...
        </p>

    </div>

</section>

</main>


<script>


    const URL_SERVIDOR =
    "https://script.google.com/macros/s/AKfycbw5LfmoztRCz4AMONfpoPYPL8uqcalm4OrOSMXgzW0IRFccgAfXvdCIYJySEZMV94pO0g/exec";

    function subirFotoDrive_PRUEBA(archivo) {
        
alert("LA FUNCIÓN DE SUBIDA SE ESTÁ EJECUTANDO");
    
        return new Promise(function(resolve, reject) {

        if (!archivo) {

            resolve("");

            return;

        }

        const estadoFoto =
            document.getElementById("estadoFoto");

        estadoFoto.textContent =
            "📷 Preparando fotografía...";


        const lector =
            new FileReader();


        lector.onload = function(e) {

            try {

                const resultado =
                    e.target.result;

                const partes =
                    resultado.split(",");

                const base64 =
                    partes[1];

                const tipoArchivo =
                    archivo.type ||
                    "image/jpeg";

                const nombreArchivo =
                    Date.now() +
                    "_" +
                    archivo.name;


                estadoFoto.textContent =
                    "📤 Subiendo fotografía...";


                /*
                 * Por ahora utilizamos una petición
                 * directa al Web App.
                 */

                fetch(
                    URL_SERVIDOR,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/x-www-form-urlencoded"
                        },

                        body:
                            "accion=subirImagen" +
                            "&base64=" +
                            encodeURIComponent(base64) +
                            "&nombreArchivo=" +
                            encodeURIComponent(nombreArchivo) +
                            "&tipoArchivo=" +
                            encodeURIComponent(tipoArchivo)

                    }

                )
                .then(function(respuesta){

                    return respuesta.text();

                })

                .then(function(resultado){

                    alert(
    "RESPUESTA DEL SERVIDOR:\n\n" +
    texto
);

console.log(
    "Respuesta:",
    texto
);

                    estadoFoto.textContent =
                        "📤 Respuesta recibida.";

                    resolve(resultado);

                })

                .catch(function(error){

                    estadoFoto.textContent =
                        "❌ Error al subir fotografía.";

                    reject(error);

                });


            } catch(error) {

                reject(error);

            }

        };


        lector.onerror =
            function(error){

                reject(error);

            };


        lector.readAsDataURL(archivo);

    });

}

function subirFotoDrive(archivo) {

    return new Promise(function(resolve, reject) {

        if (!archivo) {

            resolve("");

            return;

        }

        const lector =
            new FileReader();

        const estado =
            document.getElementById(
                "estadoFoto"
            );

        estado.textContent =
            "📷 Preparando fotografía...";


        lector.onload =
            function(e) {

                const partes =
                    e.target.result.split(",");

                const base64 =
                    partes[1];


                estado.textContent =
                    "📤 Subiendo fotografía...";


                fetch(
                    URL_SERVIDOR,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/x-www-form-urlencoded"

                        },

                        body:

                            "accion=subirImagen" +

                            "&base64=" +
                            encodeURIComponent(base64) +

                            "&nombreArchivo=" +
                            encodeURIComponent(
                                Date.now() +
                                "_" +
                                archivo.name
                            ) +

                         "&tipoArchivo=" +
encodeURIComponent(
    archivo.type
) +

"&tokenAdmin=" +
encodeURIComponent(
    sessionStorage.getItem("tokenAdmin") || ""
)

                    }
                )

                .then(function(respuesta){

                    return respuesta.text();

                })

                .then(function(texto){

                    console.log(
                        "Respuesta:",
                        texto
                    );


                    const resultado =
                        JSON.parse(texto);


                    if(!resultado.ok){

                        throw new Error(
                            resultado.error ||
                            "No se pudo subir la imagen."
                        );

                    }


                    estado.textContent =
                        "✅ Fotografía guardada correctamente.";

                   resolve(
    "https://drive.google.com/uc?export=view&id=" +
    resultado.id
);

                })

                .catch(function(error){

                    console.error(
                        "Error al subir imagen:",
                        error
                    );

                    estado.textContent =
                        "❌ No se pudo guardar la fotografía.";

                    reject(error);

                });

            };


        lector.onerror =
            function(){

                reject(
                    new Error(
                        "No se pudo leer la fotografía."
                    )
                );

            };


        lector.readAsDataURL(archivo);

    });

}
    
async function guardarProducto(){

    const nombre =
        document
        .getElementById("nombre")
        .value
        .trim();

    const precio =
        document
        .getElementById("precio")
        .value;

    const stock =
        document
        .getElementById("stock")
        .value;

    const descripcion =
        document
        .getElementById("descripcion")
        .value
        .trim();

    const descripcionDetallada =
    document
    .getElementById("descripcionDetallada")
    .value
    .trim();
    
    const estado =
        document
        .getElementById("estado")
        .value;

  const foto =
    document
    .getElementById("foto")
    .files[0];

const foto2 =
    document
    .getElementById("foto2")
    .files[0];

const foto3 =
    document
    .getElementById("foto3")
    .files[0];

const foto4 =
    document
    .getElementById("foto4")
    .files[0];

const foto5 =
    document
    .getElementById("foto5")
    .files[0];


    const categorias =
        Array.from(
            document.querySelectorAll(
                'input[type="checkbox"]:checked'
            )
        )
        .map(function(categoria){

            return categoria.value;

        })
        .join(",");


    if(
        nombre === "" ||
        precio === "" ||
        stock === ""
    ){

        alert(
            "Completa nombre, precio y stock."
        );

        return;

    }


    const mensaje =
        document.getElementById(
            "mensaje"
        );

    const estadoFoto =
        document.getElementById(
            "estadoFoto"
        );


    /* =========================
       SUBIR FOTOGRAFÍA
       ========================= */

    let urlFoto = "";
    let urlFoto2 = "";
    let urlFoto3 = "";
    let urlFoto4 = "";
    let urlFoto5 = "";

    if(foto){

        try {

            estadoFoto.textContent =
                "📤 Subiendo fotografía...";

            urlFoto =
    await subirFotoDrive(
        foto
    );

        } catch(error) {

            console.error(
                error
            );

            alert(
                "No se pudo guardar la fotografía."
            );

            return;

        }

    }
    if(foto2){

    try {

        estadoFoto.textContent =
            "📤 Subiendo fotografía 2...";

        urlFoto2 =
            await subirFotoDrive(foto2);

    } catch(error) {

        console.error(error);

        alert(
            "No se pudo guardar la fotografía 2."
        );

        return;
    }
}


if(foto3){

    try {

        estadoFoto.textContent =
            "📤 Subiendo fotografía 3...";

        urlFoto3 =
            await subirFotoDrive(foto3);

    } catch(error) {

        console.error(error);

        alert(
            "No se pudo guardar la fotografía 3."
        );

        return;
    }
}


if(foto4){

    try {

        estadoFoto.textContent =
            "📤 Subiendo fotografía 4...";

        urlFoto4 =
            await subirFotoDrive(foto4);

    } catch(error) {

        console.error(error);

        alert(
            "No se pudo guardar la fotografía 4."
        );

        return;
    }
}


if(foto5){

    try {

        estadoFoto.textContent =
            "📤 Subiendo fotografía 5...";

        urlFoto5 =
            await subirFotoDrive(foto5);

    } catch(error) {

        console.error(error);

        alert(
            "No se pudo guardar la fotografía 5."
        );

        return;
    }
}

    /* =========================
       DATOS DEL PRODUCTO
       ========================= */

    const datos = {

    id: Date.now(),

    nombre: nombre,

    precio: precio,

    stock: stock,

    descripcion: descripcion,
        
    descripcionDetallada: descripcionDetallada,

    categorias: categorias,

    estado: estado,

    foto: urlFoto,

    foto2: urlFoto2,

    foto3: urlFoto3,

    foto4: urlFoto4,

    foto5: urlFoto5,

        tokenAdmin:
    sessionStorage.getItem("tokenAdmin") || ""

};


    /* =========================
       ENVIAR PRODUCTO
       ========================= */

    const formulario =
        document.createElement("form");


    formulario.method =
        "POST";


    formulario.action =
        URL_SERVIDOR;


    formulario.target =
        "guilltac_envio";


    Object.keys(datos).forEach(
        function(campo){

            const input =
                document.createElement(
                    "input"
                );

            input.type =
                "hidden";

            input.name =
                campo;

            input.value =
                datos[campo];

            formulario.appendChild(
                input
            );

        }
    );


    const iframe =
        document.createElement("iframe");


    iframe.name =
        "guilltac_envio";


    iframe.style.display =
        "none";


    document.body.appendChild(
        iframe
    );


    document.body.appendChild(
        formulario
    );


    formulario.submit();


    /* =========================
       MENSAJE
       ========================= */

    mensaje.innerHTML =
        "✅ PRODUCTO REGISTRADO CORRECTAMENTE<br><br>" +

        "📦 Producto: " +
        nombre +
        "<br>" +

        "💰 Precio: Bs " +
        precio +
        "<br>" +

        "📦 Stock: " +
        stock +
        "<br>" +

        (
            urlFoto
            ? "📷 Fotografía guardada en Drive"
            : "📷 Sin fotografía"
        );


    mensaje.style.display =
        "block";


    /* =========================
       LIMPIAR FORMULARIO
       ========================= */

    document
    .getElementById("nombre")
    .value = "";

    document
    .getElementById("precio")
    .value = "";

    document
    .getElementById("stock")
    .value = "";

    document
    .getElementById("descripcion")
    .value = "";

    document
    .getElementById("estado")
    .value =
        "activo";


    document
    .getElementById("foto")
    .value = "";


    estadoFoto.textContent =
        "";


    document
    .querySelectorAll(
        'input[type="checkbox"]'
    )
    .forEach(function(caja){

        caja.checked = false;

    });

}

function quitarFoto(idFoto) {

    const campoFoto =
        document.getElementById(idFoto);

    if (campoFoto) {
        campoFoto.value = "";
    }

}
    
</script>


</body>

</html>
