<script>

const URL_SERVIDOR =
"https://script.google.com/macros/s/AKfycbw5LfmoztRCz4AMONfpoPYPL8uqcalm4OrOSMXgzW0IRFccgAfXvdCIYJySEZMV94pO0g/exec";

let pedidosCargados = [];


function escapar(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){
        return "-";
    }

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatearFecha(valor){

    if(!valor){
        return "-";
    }

    const fecha = new Date(valor);

    if(isNaN(fecha.getTime())){
        return escapar(valor);
    }

    return fecha.toLocaleString(
        "es-BO",
        {
            dateStyle:"short",
            timeStyle:"short"
        }
    );
}


function formatearDinero(valor){

    if(
        valor === "" ||
        valor === null ||
        valor === undefined
    ){
        return "Bs 0.00";
    }

    const numero = Number(valor);

    if(isNaN(numero)){
        return "Bs " + escapar(valor);
    }

    return "Bs " + numero.toFixed(2);
}


function cargarPedidos(){

    const estadoCarga =
        document.getElementById("estadoCarga");

    const tablaContenedor =
        document.getElementById("tablaContenedor");

    estadoCarga.style.display = "block";
    estadoCarga.textContent =
        "Cargando pedidos...";

    tablaContenedor.style.display = "none";


    const datos =
        new URLSearchParams();

    datos.append(
        "accion",
        "listarPedidos"
    );

    datos.append(
        "tokenAdmin",
        sessionStorage.getItem("tokenAdmin") || ""
    );


    fetch(
        URL_SERVIDOR,
        {
            method:"POST",
            body:datos
        }
    )

    .then(function(respuesta){
        return respuesta.json();
    })

    .then(function(resultado){

        if(!resultado.autorizado){

            sessionStorage.removeItem(
                "tokenAdmin"
            );

            alert(
                resultado.mensaje ||
                "La sesión administrativa venció."
            );

            window.location.replace(
                "admin.html"
            );

            return;
        }


        if(!resultado.ok){

            throw new Error(
                resultado.mensaje ||
                "No se pudieron cargar los pedidos."
            );
        }


        pedidosCargados =
            resultado.pedidos || [];

        mostrarPedidos();

    })

    .catch(function(error){

        console.error(error);

        estadoCarga.style.display =
            "block";

        estadoCarga.textContent =
            "❌ No se pudieron cargar los pedidos.";

    });

}


function claveRevisionPedido(idPedido){
    return "rhino_revision_pedido_"+String(idPedido||"").trim().toUpperCase();
}

function fechaMilisegundos(valor){
    if(!valor) return 0;
    const fecha=new Date(valor);
    const tiempo=fecha.getTime();
    return Number.isFinite(tiempo)?tiempo:0;
}

function firmaNovedadPedido(pedido){
    return JSON.stringify([pedido.ultima_actualizacion||"",pedido.estado_pedido||"",pedido.estado_pago||"",pedido.comprobante_pago||"",pedido.fecha_comprobante||"",pedido.estado_devolucion||"",pedido.solicitud_reactivacion||"",pedido.fecha_solicitud_reactivacion||"",pedido.fecha_solicitud_devolucion||""]);
}
function pedidoYaRevisado(pedido){
    const clave=claveRevisionPedido(pedido.id_pedido)+"_firma";
    return localStorage.getItem(clave)===firmaNovedadPedido(pedido);
}
function tieneActividadNueva(pedido){
    if(pedidoYaRevisado(pedido)) return false;
    const guardada=localStorage.getItem(claveRevisionPedido(pedido.id_pedido)+"_firma");
    if(guardada===null) return false;
    try{
        const anterior=JSON.parse(guardada);
        const actual=JSON.parse(firmaNovedadPedido(pedido));
        // Sólo nuevas cargas o solicitudes del cliente; un cambio administrativo no es una novedad sin leer.
        return [3,4,7,8].some(function(i){return !!actual[i]&&actual[i]!==anterior[i];});
    }catch(error){return false;}
}
function marcarPedidoRevisado(pedido){
    if(!pedido||!pedido.id_pedido) return;
    localStorage.setItem(claveRevisionPedido(pedido.id_pedido),String(fechaMilisegundos(pedido.ultima_actualizacion)||Date.now()));
    localStorage.setItem(claveRevisionPedido(pedido.id_pedido)+"_firma",firmaNovedadPedido(pedido));
}
function normalizarEstadoRhino(valor){
    return String(valor||"").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function obtenerAlertaPedido(pedido){
    if(pedidoYaRevisado(pedido)) return null;
    const estadoPedido=normalizarEstadoRhino(pedido.estado_pedido);
    const estadoPago=normalizarEstadoRhino(pedido.estado_pago);
    const devolucion=normalizarEstadoRhino(pedido.estado_devolucion);
    const reactivacion=normalizarEstadoRhino(pedido.solicitud_reactivacion);
    const guardada=localStorage.getItem(claveRevisionPedido(pedido.id_pedido)+"_firma");
    const nuevaActividad=tieneActividadNueva(pedido);
    if(guardada!==null&&!nuevaActividad) return null;
    if(estadoPago==="EN VERIFICACION") return {texto:"🟠 COMPROBANTE NUEVO",clase:"alerta-comprobante"};
    if(reactivacion==="SOLICITADA"||devolucion==="REACTIVACION SOLICITADA") return {texto:"🔄 REACTIVACIÓN PENDIENTE",clase:"alerta-reactivacion"};
    if(["DEVOLUCION SOLICITADA","DEVOLUCION PENDIENTE"].includes(devolucion)) return {texto:"💰 DEVOLUCIÓN PENDIENTE",clase:"alerta-devolucion"};
    const pagado=["PAGO CONFIRMADO","PAGADO","CONFIRMADO"].includes(estadoPago);
    if(guardada===null&&!pagado&&(estadoPedido==="PEDIDO RECIBIDO"||!estadoPedido)) return {texto:"🔴 NUEVO",clase:"alerta-nuevo"};
    if(nuevaActividad) return {texto:"🔵 ACTIVIDAD NUEVA",clase:"alerta-actividad"};
    return null;
}
function marcarNovedadesRevisadasRhino(){
    pedidosCargados.forEach(marcarPedidoRevisado);
    mostrarPedidos();
}
window.addEventListener("storage",function(evento){
    if(evento.key===null||evento.key.startsWith("rhino_revision_pedido_")) mostrarPedidos();
});

function obtenerUrlVistaNota(url){
    const texto=String(url||"").trim();
    if(!texto) return "";
    const coincidencia=texto.match(/[?&]id=([^&]+)/);
    if(coincidencia&&coincidencia[1]) return "https://drive.google.com/file/d/"+encodeURIComponent(coincidencia[1])+"/view";
    const ruta=texto.match(/\/file\/d\/([^/]+)/);
    if(ruta&&ruta[1]) return "https://drive.google.com/file/d/"+encodeURIComponent(ruta[1])+"/view";
    return texto;
}

function verNotaVenta(url){
    const vista=obtenerUrlVistaNota(url);
    if(!vista) return;
    abrirDocumentoFlotante(vista,"Nota de venta");
}

function descargarNotaVenta(url){
    const descarga=String(url||"").trim();
    if(!descarga) return;
    window.open(descarga,"_blank","noopener");
}

function bloquearBotonesPago(bloquear){
    ["btnConfirmarPago","btnConfirmarAvisarPago","btnRechazarPago"].forEach(function(id){
        const boton=document.getElementById(id);
        if(boton) boton.disabled=!!bloquear;
    });
}

function ejecutarAccionPago(accion,indice,mensajeConfirmacion,avisarWhatsApp){
    const pedido=pedidosCargados[indice];
    if(!pedido) return;

    const idPedido=String(pedido.id_pedido||"").trim();
    if(!idPedido) return;
    if(!confirm(mensajeConfirmacion)) return;

    bloquearBotonesPago(true);

    const datos=new URLSearchParams();
    datos.append("accion",accion);
    datos.append("tokenAdmin",sessionStorage.getItem("tokenAdmin") || "");
    datos.append("id_pedido",idPedido);

    fetch(URL_SERVIDOR,{method:"POST",body:datos})
    .then(function(respuesta){return respuesta.json();})
    .then(function(resultado){
        if(!resultado.autorizado){
            sessionStorage.removeItem("tokenAdmin");
            alert(resultado.mensaje || "La sesión administrativa venció.");
            window.location.replace("admin.html");
            return;
        }
        if(!resultado.ok){
            throw new Error(resultado.mensaje || "No se pudo actualizar el pago.");
        }

        alert("✅ " + (resultado.mensaje || "Pago actualizado correctamente."));

        if(avisarWhatsApp){
            enviarConfirmacionPagoWhatsApp(indice);
        }

        cerrarPedido();
        cargarPedidos();
    })
    .catch(function(error){
        console.error(error);
        alert("❌ " + error.message);
        bloquearBotonesPago(false);
    });
}

function confirmarPagoPedido(indice){
    const pedido=pedidosCargados[indice];
    if(!pedido) return;
    const idPedido=String(pedido.id_pedido||"").trim();

    ejecutarAccionPago(
        "confirmarPagoPedido",
        indice,
        "¿Confirmas que revisaste el comprobante y que el pago fue recibido correctamente?\n\nPedido: " + idPedido,
        false
    );
}

function confirmarPagoYWhatsApp(indice){
    const pedido=pedidosCargados[indice];
    if(!pedido) return;
    const idPedido=String(pedido.id_pedido||"").trim();

    ejecutarAccionPago(
        "confirmarPagoPedido",
        indice,
        "¿Confirmas el pago y deseas preparar el aviso por WhatsApp para el cliente?\n\nPedido: " + idPedido,
        true
    );
}

function rechazarComprobantePedido(indice){
    const pedido=pedidosCargados[indice];
    if(!pedido) return;
    const motivo=String(document.getElementById("motivoNoConfirmado").value||"").trim();
    if(motivo.length<5||motivo.length>1000){
        alert("Escribe el motivo (de 5 a 1000 caracteres) antes de continuar.");
        return;
    }
    if(!confirm("¿Guardar el pago como no confirmado y preparar el aviso al cliente?\n\nMotivo: "+motivo)) return;
    // Open synchronously so the browser can associate the window with the click.
    const aviso=window.open("about:blank","_blank");
    if(aviso) aviso.opener=null;
    bloquearBotonesPago(true);
    const datos=new URLSearchParams();
    datos.append("accion","rechazarComprobantePedido");
    datos.append("tokenAdmin",sessionStorage.getItem("tokenAdmin")||"");
    datos.append("id_pedido",pedido.id_pedido);
    datos.append("motivo_no_confirmado",motivo);
    fetch(URL_SERVIDOR,{method:"POST",body:datos})
    .then(r=>r.json())
    .then(function(resultado){
        if(!resultado.autorizado){
            sessionStorage.removeItem("tokenAdmin");
            if(aviso) aviso.close();
            alert(resultado.mensaje||"La sesión administrativa venció.");
            window.location.replace("admin.html");
            return;
        }
        if(!resultado.ok) throw new Error(resultado.mensaje||"No se pudo guardar el motivo.");

        if(telefono.length>=10&&telefono.length<=15){
            const url="https://wa.me/"+telefono+"?text="+encodeURIComponent(mensaje);
            if(aviso) aviso.location.replace(url);

            alert("Motivo guardado. Pulsa Enviar en WhatsApp para avisar al cliente.");
        }else{
            if(aviso) aviso.close();
            alert("Motivo guardado, pero el teléfono no es válido. Revisa el contacto para avisar al cliente.");
        }
        cerrarPedido();
        cargarPedidos();
    }).catch(function(error){
        if(aviso) aviso.close();
        alert("❌ "+error.message);
        bloquearBotonesPago(false);
    });
}

function formatearTelefonoVisual(telefono){
    const original=String(telefono||"").trim();
    const digitos=original.replace(/\D/g,"");
    if(!digitos) return original;
    if(digitos.length===11 && digitos.startsWith("591")){
        return "+591 "+digitos.slice(3);
    }
    return original;
}


function mostrarPedidos(){

    const cuerpo=document.getElementById("tablaPedidos");
    const estadoCarga=document.getElementById("estadoCarga");
    const tablaContenedor=document.getElementById("tablaContenedor");
    const resumen=document.getElementById("resumenAtencion");

    cuerpo.innerHTML="";

    if(pedidosCargados.length===0){
        estadoCarga.style.display="block";
        estadoCarga.textContent="No hay pedidos registrados.";
        tablaContenedor.style.display="none";
        resumen.style.display="block";
        resumen.textContent="✓ 0 novedades sin revisar.";
        return;
    }

    let requierenAtencion=0;

    pedidosCargados.forEach(function(pedido,indice){
        const alerta=obtenerAlertaPedido(pedido);
        if(alerta) requierenAtencion++;

        const notaDisponible=
            String(pedido.estado_pedido||"").trim().toUpperCase()==="ENTREGADO" &&
            String(pedido.url_nota_pdf||"").trim()!=="";

        const indicador=alerta
            ?"<br><span class='alerta-pedido "+alerta.clase+"'>"+alerta.texto+"</span>"
            :"";

        let acciones=
            "<div class='acciones-rapidas'>"+
            "<button type='button' class='btn-ver' onclick='verPedido("+indice+")'>👁 Ver</button>"+
            "<button type='button' class='btn-whatsapp' onclick='enviarMensajeClienteWhatsApp("+indice+")'>📱 WhatsApp</button>";

        if(notaDisponible){
            const url=JSON.stringify(String(pedido.url_nota_pdf||""));
            acciones+=
                "<button type='button' class='btn-nota' onclick='verNotaVenta("+url+")'>📄 Ver / Imprimir</button>"+
                "<button type='button' class='btn-descargar' onclick='descargarNotaVenta("+url+")'>⬇️ Descargar</button>"+
                "<button type='button' class='btn-whatsapp' onclick='enviarNotaWhatsApp("+indice+")'>📱 Enviar nota</button>";
        }

        acciones+="</div>";

        const fila=document.createElement("tr");
        fila.innerHTML=
            "<td><strong>"+escapar(pedido.id_pedido)+"</strong>"+indicador+"</td>"+
            "<td>"+formatearFecha(pedido.fecha_pedido)+"</td>"+
            "<td>"+escapar(pedido.cliente)+"</td>"+
            "<td><strong>"+formatearDinero(pedido.total_a_cobrar)+"</strong></td>"+
            "<td><span class='estado'>"+escapar(pedido.estado_pago||"PENDIENTE")+"</span></td>"+
            "<td><span class='estado'>"+escapar(pedido.estado_pedido||"PEDIDO RECIBIDO")+"</span></td>"+
            "<td>"+acciones+"</td>";

        cuerpo.appendChild(fila);
    });

    if(requierenAtencion>0){
        resumen.style.display="block";
        resumen.textContent="⚠️ "+requierenAtencion+
            (requierenAtencion===1?" pedido requiere atención.":" pedidos requieren atención.");
    }else{
        resumen.style.display="block";
        resumen.textContent="✓ 0 novedades sin revisar.";
    }

    estadoCarga.style.display="none";
    tablaContenedor.style.display="block";
}

let focoAnteriorDocumentoRhino=null;
function abrirDocumentoFlotante(url,titulo){
    let parsed;
    try{parsed=new URL(String(url||""));}catch(error){alert("Enlace no válido.");return;}
    if(parsed.protocol!=="https:"&&parsed.protocol!=="http:"){alert("Enlace no válido.");return;}
    let vista=parsed.href;
    if(parsed.hostname==="drive.google.com"){
        const ruta=parsed.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        const id=ruta?ruta[1]:parsed.searchParams.get("id");
        if(id&&/^[a-zA-Z0-9_-]+$/.test(id)) vista="https://drive.google.com/file/d/"+encodeURIComponent(id)+"/preview";
    }
    focoAnteriorDocumentoRhino=document.activeElement;
    document.getElementById("tituloDocumentoRhino").textContent=titulo||"Documento";
    document.getElementById("visorDocumentoRhino").src=vista;
    document.getElementById("modalDocumentoRhino").style.display="block";
    document.getElementById("cerrarDocumentoRhino").focus();
}
function cerrarDocumentoFlotante(){
    document.getElementById("modalDocumentoRhino").style.display="none";
    document.getElementById("visorDocumentoRhino").src="about:blank";
    if(focoAnteriorDocumentoRhino&&focoAnteriorDocumentoRhino.isConnected) focoAnteriorDocumentoRhino.focus();
}

function comprobantePagoHtml(valor){
    const texto=String(valor||"").trim();
    if(!texto) return dato("Comprobante","Sin comprobante");
    let url;
    try { url=new URL(texto); } catch(error) { return dato("Comprobante","Enlace no válido"); }
    if(url.protocol!=="https:"&&url.protocol!=="http:") return dato("Comprobante","Enlace no válido");
    let ver=url.href, descargar=url.href;
    if(url.hostname==="drive.google.com"){
        const ruta=url.pathname.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
        const id=ruta?ruta[1]:url.searchParams.get("id");
        if(id&&/^[a-zA-Z0-9_-]+$/.test(id)){
            ver="https://drive.google.com/file/d/"+encodeURIComponent(id)+"/view";
            descargar="https://drive.google.com/uc?export=download&id="+encodeURIComponent(id);
        }
    }
    return "<div class='dato'><strong>Comprobante</strong><div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;'>"+
        "<button type='button' class='btn-ver' data-url='"+escapar(ver)+"' onclick='abrirDocumentoFlotante(this.dataset.url,\"Comprobante de pago\")'>👁️ VER</button>"+
        "<a class='btn-descargar' style='padding:10px 14px;border-radius:6px;text-decoration:none;' href='"+escapar(descargar)+"' target='_blank' rel='noopener noreferrer'>⬇️ DESCARGAR</a></div></div>";
}

function actualizarBotonesEstadoPedido(){
    const selector=document.getElementById("nuevoEstadoPedido");
    if(!selector) return;
    const iguales=selector.value.trim().toUpperCase()===String(selector.dataset.estadoActual||"").trim().toUpperCase();
    const bloqueado=iguales||selector.dataset.guardando==="si";
    ["btnGuardarEstadoPedido","btnGuardarAvisarPedido"].forEach(function(id){

        if(boton){ boton.disabled=bloqueado; boton.style.opacity=bloqueado?"0.5":"1"; boton.style.cursor=bloqueado?"not-allowed":"pointer"; }
    });

function iniciarGuardadoEstadoPedido(){
    const selector=document.getElementById("nuevoEstadoPedido");

    if(selector.value.trim().toUpperCase()===String(selector.dataset.estadoActual||"").trim().toUpperCase()){
        alert("El pedido ya tiene ese estado. Selecciona uno diferente.");
        return false;

}

    document

    document

    return (
        "<option value='" +

function guardarEstadoYWhatsApp(idPedido,indice){
    const selector=document.getElementById("nuevoEstadoPedido");
    const boton=document.getElementById("btnGuardarAvisarPedido");

    if(!selector||!idPedido) return;

    if(!iniciarGuardadoEstadoPedido()) return;
    const nuevoEstado=selector.value;

    if(!confirm(
        "¿Guardar el estado \""+nuevoEstado+"\" y preparar el aviso por WhatsApp para el cliente?"
    )){
        return;
    }

    if(boton){
        boton.disabled=true;
        boton.textContent="Guardando...";
    }

    bloquearGuardadoEstadoPedido(true);
    const datos=new URLSearchParams();
    datos.append("accion","actualizarEstadoPedido");

function consultarVerificacionPolicialPedido(p){
    const contenedor=document.getElementById("controlVerificacionPolicial");
    if(!contenedor) return;

    const ci=String((p&&p.ci)||"").trim();
    if(!ci){
        contenedor.innerHTML="<p style='margin:0;'>Este pedido no tiene C.I. registrado.</p>";
        return;
    }

    const datos=new URLSearchParams();
    datos.append("accion","consultarClientePolicial");
    datos.append("ci",ci);

    fetch(URL_SERVIDOR,{method:"POST",body:datos})
    .then(function(respuesta){ return respuesta.json(); })
    .then(function(resultado){
        if(resultado.ok && resultado.verificado){
            contenedor.innerHTML=
                "<p style='margin:0 0 12px;line-height:1.5;'><strong>✅ FUNCIONARIO POLICIAL VERIFICADO</strong><br>"+
                "C.I.: "+escapar(ci)+"<br>Beneficio policial activo"+
                (Number(resultado.porcentaje)>0?" · Descuento: "+escapar(resultado.porcentaje)+"%":"")+"</p>"+
                "<button type='button' class='btn-cancelar' onclick='cambiarEstadoBeneficioPolicial("+JSON.stringify(ci)+","+JSON.stringify("INACTIVO")+")'>🚫 QUITAR BENEFICIO POLICIAL</button>";
            return;
        }

        if(resultado.ok && resultado.inactivo){
            contenedor.innerHTML=
                "<p style='margin:0 0 12px;line-height:1.5;'><strong>🚫 BENEFICIO POLICIAL INACTIVO</strong><br>Lo sentimos, por el momento el beneficio policial no está activado.</p>"+
                "<button type='button' class='btn-guardar-estado' onclick='cambiarEstadoBeneficioPolicial("+JSON.stringify(ci)+","+JSON.stringify("VERIFICADO")+")'>♻️ REACTIVAR BENEFICIO POLICIAL</button>";
            return;
        }

        contenedor.innerHTML=
            "<p style='margin-top:0;'>Verifica la condición policial antes de registrar este C.I. como beneficiario.</p>"+
            "<button type='button' id='btnVerificarPolicia' class='btn-verificar-policia' onclick='verificarClientePolicial("+JSON.stringify(String((p&&p.id_pedido)||""))+")'>👮 VERIFICAR FUNCIONARIO POLICIAL</button>";
    })
    .catch(function(error){
        console.error(error);
        contenedor.innerHTML="<p style='margin:0;'>⚠️ No se pudo consultar la verificación policial en este momento.</p>";
    });
}


function cambiarEstadoBeneficioPolicial(ci,estado){
    const activar=String(estado||"").toUpperCase()==="VERIFICADO";
    const pregunta=activar
        ? "¿Reactivar el beneficio policial para este cliente?"
        : "¿Quitar el beneficio policial para este cliente? Las compras futuras ya no recibirán el descuento policial.";

    if(!confirm(pregunta)) return;

    const token=sessionStorage.getItem("tokenAdmin");
    if(!token){
        alert("La sesión administrativa venció. Inicia sesión nuevamente.");
        window.location.replace("admin.html");
        return;
    }

    const datos=new URLSearchParams();
    datos.append("accion","cambiarEstadoBeneficioPolicial");
    datos.append("tokenAdmin",token);
    datos.append("ci",String(ci||""));
    datos.append("estado",String(estado||""));

    fetch(URL_SERVIDOR,{method:"POST",body:datos})
    .then(function(respuesta){ return respuesta.json(); })
    .then(function(resultado){
        if(resultado.autorizado===false){
            sessionStorage.removeItem("tokenAdmin");
            alert(resultado.mensaje||"Sesión administrativa vencida.");
            window.location.replace("admin.html");
            return;
        }
        if(!resultado.ok){
            alert(resultado.mensaje||"No se pudo actualizar el beneficio policial.");
            return;
        }

        alert(resultado.mensaje);
        const pedidoActual=pedidosCargados.find(function(item){
            return String(item.ci||"").trim()===String(ci||"").trim();
        });
        if(pedidoActual) consultarVerificacionPolicialPedido(pedidoActual);
    })
    .catch(function(error){
        console.error(error);
        alert("No se pudo conectar con el servidor.");
    });
}


function verificarClientePolicial(idPedido){

    if(!idPedido){
        return;
    }

    if(!confirm(
        "¿Confirmas que verificaste la condición de funcionario policial de este cliente?\n\n" +
        "Su C.I. quedará registrado como cliente policial verificado."
    )){
        return;
    }

    const boton =
        document.getElementById("btnVerificarPolicia");

    if(boton){
        boton.disabled = true;
        boton.textContent = "Verificando...";
    }

    const datos =
        new URLSearchParams();

    datos.append(
        "accion",
        "verificarClientePolicial"
    );

    datos.append(
        "tokenAdmin",
        sessionStorage.getItem("tokenAdmin") || ""
    );

    datos.append(
        "id_pedido",
        idPedido
    );

    fetch(
        URL_SERVIDOR,
        {
            method:"POST",
            body:datos
        }
    )
    .then(function(respuesta){
        return respuesta.json();
    })
    .then(function(resultado){

        if(!resultado.autorizado){

            sessionStorage.removeItem("tokenAdmin");

            alert(
                resultado.mensaje ||
                "La sesión administrativa venció."
            );

            window.location.replace("admin.html");
            return;
        }

        if(!resultado.ok){
            throw new Error(
                resultado.mensaje ||
                "No se pudo verificar al funcionario."
            );
        }

        alert(
            "✅ FUNCIONARIO POLICIAL VERIFICADO\n\n" +
            "C.I.: " + (resultado.ci || "") + "\n" +
            "Nombre: " + (resultado.nombre || "")
        );

        const pedidoActual=pedidosCargados.find(function(item){
            return String(item.id_pedido||"")===String(idPedido||"");
        });
        if(pedidoActual){
            consultarVerificacionPolicialPedido(pedidoActual);
        }else if(boton){
            boton.disabled = true;
            boton.textContent = "✅ FUNCIONARIO VERIFICADO";
        }

    })
    .catch(function(error){

        console.error(error);

        alert(
            "❌ No se pudo registrar la verificación.\n\n" +
            error.message
        );

        if(boton){
            boton.disabled = false;
            boton.textContent = "👮 VERIFICAR FUNCIONARIO POLICIAL";
        }
    });
}


function cerrarPedido(){

    document
    .getElementById("modalPedido")
    .style.display = "none";

}


document
.getElementById("modalPedido")
.addEventListener(
    "click",
    function(event){

        if(event.target === this){
            cerrarPedido();
        }

    }
);


document.addEventListener(
    "keydown",

        if(event.key === "Escape"){
            if(document.getElementById("modalDocumentoRhino").style.display==="block") cerrarDocumentoFlotante();
            else cerrarPedido();
        }

    }
);


document.getElementById("modalDocumentoRhino").addEventListener("click",function(event){if(event.target===this) cerrarDocumentoFlotante();});
cargarPedidos();

<script>
async function cerrarSesionRhino(boton){
    const token=sessionStorage.getItem("tokenAdmin");
    if(boton) boton.disabled=true;
    try{
        if(token){
            const control=new AbortController();
            const espera=setTimeout(function(){control.abort();},12000);
            try{
                const respuesta=await fetch(URL_SERVIDOR,{method:"POST",body:new URLSearchParams({accion:"cerrarSesionAdmin",tokenAdmin:token}),signal:control.signal});
                const resultado=await respuesta.json();
                if(!respuesta.ok||!resultado.ok) throw new Error("No se pudo cerrar la sesión en el servidor.");
            }finally{clearTimeout(espera);}
        }
    }catch(error){
        alert("Se cerrará la sesión en este navegador. No se pudo confirmar el cierre en el servidor; allí vencerá al finalizar su plazo.");
    }finally{
        sessionStorage.removeItem("tokenAdmin");
        window.location.replace("index.html");
    }
}
</script>
