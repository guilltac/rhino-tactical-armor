<html lang="es">

<head>
<meta charset="UTF-8">

<title>RHINO TACTICAL ARMOR - Gestionar pedidos</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    color:#222;
}

header{
    background:#151515;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:7px 0 0;
    color:#bbb;
}

.container{
    max-width:1200px;
    margin:30px auto;
    padding:0 20px;
}

.barra{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.volver{
    color:#222;
    text-decoration:none;
    font-weight:bold;
}

button{
    border:0;
    border-radius:6px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.btn-actualizar{
    background:#315f24;
    color:white;
}

.panel{
    background:white;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
    overflow:hidden;
}

.estado-carga{
    padding:25px;
    text-align:center;
    color:#666;
}

.tabla-contenedor{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,
td{
    padding:13px 12px;
    border-bottom:1px solid #ddd;
    text-align:left;
    vertical-align:middle;
}

th{
    background:#222;
    color:white;
    font-size:13px;
}

td{
    font-size:14px;
}

.btn-ver{
    background:#222;
    color:white;
    white-space:nowrap;
}

.estado{
    display:inline-block;
    padding:5px 8px;
    border-radius:12px;
    background:#eee;
    font-size:12px;
    font-weight:bold;
}

.modal{
    display:none;
    position:fixed;
    z-index:9999;
    inset:0;
    background:rgba(0,0,0,.72);
    padding:20px;
    overflow:auto;
}

.modal-contenido{
    max-width:850px;
    margin:25px auto;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

.modal-cabecera{
    background:#151515;
    color:white;
    padding:18px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.modal-cabecera h2{
    margin:0;
    font-size:20px;
}

.btn-cerrar{
    width:auto;
    background:#8b1e1e;
    color:white;
    font-size:18px;
}

.modal-cuerpo{
    padding:22px;
}

.seccion{
    margin-bottom:22px;
}

.seccion h3{
    margin:0 0 12px;
    padding-bottom:7px;
    border-bottom:1px solid #ddd;
}

.datos{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:10px 20px;
}

.dato{
    padding:8px 0;
    word-break:break-word;
}

.dato strong{
    display:block;
    font-size:12px;
    color:#666;
    margin-bottom:4px;
}

.productos{
    white-space:pre-line;
    background:#f6f6f6;
    padding:12px;
    border-radius:6px;
}

.control-estado{
    background:#f6f6f6;
    border:1px solid #ddd;
    border-radius:8px;
    padding:16px;
}

.control-estado label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

.control-estado select{
    width:100%;
    padding:11px;
    border:1px solid #bbb;
    border-radius:6px;
    background:white;
    font-size:14px;
    margin-bottom:10px;
}

.btn-guardar-estado{
    background:#315f24;
    color:white;
    width:100%;
}

.btn-guardar-estado:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.control-verificacion{
    background:#f6f6f6;
    border:1px solid #ddd;
    border-radius:8px;
    padding:16px;
}

.btn-verificar-policia{
    background:#1f4d73;
    color:white;
    width:100%;
}

.btn-verificar-policia:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-whatsapp{
    background:#1f9d48;
    color:white;
    width:100%;
    margin-top:10px;
}
.control-pago{
    background:#fff8e6;
    border:1px solid #e2c36b;
    border-radius:8px;
    padding:16px;
}
.acciones-pago{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
    margin-top:12px;
}
.btn-comprobante{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#222;
    color:white;
    border-radius:6px;
    padding:11px 14px;
    font-weight:bold;
    margin-top:10px;
}
.btn-confirmar-pago{
    background:#315f24;
    color:white;
    width:100%;
}
.btn-rechazar-pago{
    background:#8b1e1e;
    color:white;
    width:100%;
}
.control-postventa{background:#eef3f7;border:1px solid #a9b7c4;border-radius:8px;padding:16px;margin-top:12px;}
.btn-reactivar{background:#315f24;color:white;width:100%;}
.btn-devolucion{background:#8a5d14;color:white;width:100%;}
.aviso-pago{
    margin:0 0 10px;
    line-height:1.5;
}
@media(max-width:650px){
    .acciones-pago{
        grid-template-columns:1fr;
    }
}

@media(max-width:650px){
    .datos{
        grid-template-columns:1fr;
    }

    .container{
        padding:0 12px;
    }
}
</style>
</head>

<body>

<script>
if (!sessionStorage.getItem("tokenAdmin")) {
    window.location.replace("admin.html");
}
</script>

<header>
    <h1>RHINO TACTICAL ARMOR</h1>
    <p>Gestión de pedidos</p>
</header>

<main class="container">

    <div class="barra">
        <a href="admin.html" class="volver">
            ← Volver al panel
        </a>

        <button
            type="button"
            class="btn-actualizar"
            onclick="cargarPedidos()"
        >
            ↻ Actualizar pedidos
        </button>
    </div>

    <div class="panel">

        <div id="estadoCarga" class="estado-carga">
            Cargando pedidos...
        </div>

        <div
            id="tablaContenedor"
            class="tabla-contenedor"
            style="display:none;"
        >
            <table>
                <thead>
                    <tr>
                        <th>Pedido</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Total</th>
                        <th>Pago</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="tablaPedidos"></tbody>
            </table>
        </div>

    </div>

</main>

<div id="modalPedido" class="modal">
    <div class="modal-contenido">

        <div class="modal-cabecera">
            <h2 id="tituloPedido">
                Detalle del pedido
            </h2>

            <button
                type="button"
                class="btn-cerrar"
                onclick="cerrarPedido()"
            >
                ✕
            </button>
        </div>

        <div
            id="detallePedido"
            class="modal-cuerpo"
        ></div>

    </div>
</div>

<script>

const URL_SERVIDOR =
"https://script.google.com/macros/s/AKfycbw5LfmoztRCz4AMONfpoPYPL8uqcalm4OrOSMXgzW0IRFccgAfXvdCIYJySEZMV94pO0g/exec";

let pedidosCargados = [];

function escapar(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){
        return "-";
    }

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function escaparAtributoURL(valor){
    const url=String(valor||"").trim();
    if(!/^https:\/\//i.test(url)) return "#";
    return url
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function formatearFecha(valor){

    if(!valor){
        return "-";
    }

    const fecha = new Date(valor);

    if(isNaN(fecha.getTime())){
        return escapar(valor);
    }

    return fecha.toLocaleString(
        "es-BO",
        {
            dateStyle:"short",
            timeStyle:"short"
        }
    );
}

function formatearDinero(valor){

    if(
        valor === "" ||
        valor === null ||
        valor === undefined
    ){
        return "Bs 0.00";
    }

    const numero = Number(valor);

    if(isNaN(numero)){
        return "Bs " + escapar(valor);
    }

    return "Bs " + numero.toFixed(2);
}

function cargarPedidos(){

    const estadoCarga =
        document.getElementById("estadoCarga");

    const tablaContenedor =
        document.getElementById("tablaContenedor");

    estadoCarga.style.display = "block";
    estadoCarga.textContent =
        "Cargando pedidos...";

    tablaContenedor.style.display = "none";

    const datos =
        new URLSearchParams();

    datos.append(
        "accion",
        "listarPedidos"
    );

    datos.append(
        "tokenAdmin",
        sessionStorage.getItem("tokenAdmin") || ""
    );

    fetch(
        URL_SERVIDOR,
        {
            method:"POST",
            body:datos
        }
    )

    .then(function(respuesta){
        return respuesta.json();
    })

    .then(function(resultado){

        if(!resultado.autorizado){

            sessionStorage.removeItem(
                "tokenAdmin"
            );

            alert(
                resultado.mensaje ||
                "La sesión administrativa venció."
            );

            window.location.replace(
                "admin.html"
            );

            return;
        }

        if(!resultado.ok){

            throw new Error(
                resultado.mensaje ||
                "No se pudieron cargar los pedidos."
            );
        }

        pedidosCargados =
            resultado.pedidos || [];

        mostrarPedidos();

    })

    .catch(function(error){

        console.error(error);

        estadoCarga.style.display =
            "block";

        estadoCarga.textContent =
            "❌ No se pudieron cargar los pedidos.";

    });

}

function mostrarPedidos(){

    const cuerpo =
        document.getElementById("tablaPedidos");

    const estadoCarga =
        document.getElementById("estadoCarga");

    const tablaContenedor =
        document.getElementById("tablaContenedor");

    cuerpo.innerHTML = "";

    if(pedidosCargados.length === 0){

        estadoCarga.style.display =
            "block";

        estadoCarga.textContent =
            "No hay pedidos registrados.";

        tablaContenedor.style.display =
            "none";

        return;
    }

    pedidosCargados.forEach(
        function(pedido, indice){

            const fila =
                document.createElement("tr");

            fila.innerHTML =
                "<td><strong>" +
                    escapar(pedido.id_pedido) +
                "</strong></td>" +

                "<td>" +
                    formatearFecha(
                        pedido.fecha_pedido
                    ) +
                "</td>" +

                "<td>" +
                    escapar(pedido.cliente) +
                "</td>" +

                "<td><strong>" +
                    formatearDinero(
                        pedido.total_a_cobrar
                    ) +
                "</strong></td>" +

                "<td><span class='estado'>" +
                    escapar(
                        pedido.estado_pago ||
                        "PENDIENTE"
                    ) +
                "</span></td>" +

                "<td><span class='estado'>" +
                    escapar(
                        pedido.estado_pedido ||
                        "PEDIDO RECIBIDO"
                    ) +
                "</span></td>" +

                "<td>" +
                    "<button " +
                    "type='button' " +
                    "class='btn-ver' " +
                    "onclick='verPedido(" +
                    indice +
                    ")'>" +
                    "👁 Ver" +
                    "</button>" +
                "</td>";

            cuerpo.appendChild(fila);

        }
    );

    estadoCarga.style.display =
        "none";

    tablaContenedor.style.display =
        "block";
}

function dato(titulo, valor){

    return (
        "<div class='dato'>" +
            "<strong>" +
                escapar(titulo) +
            "</strong>" +
            escapar(valor) +
        "</div>"
    );
}

function verPedido(indice){

    const p =
        pedidosCargados[indice];

    if(!p){
        return;
    }

    document
    .getElementById("tituloPedido")
    .textContent =
        "Pedido " +
        (p.id_pedido || "");

    let html = "";

    html +=
        "<div class='seccion'>" +
        "<h3>👤 Cliente</h3>" +
        "<div class='datos'>" +

            dato("Nombre", p.cliente) +
            dato("Teléfono", p.telefono) +
            dato("CI", p.ci) +
            dato("Departamento", p.departamento) +
            dato("Dirección", p.direccion) +
            dato("Fecha del pedido", formatearFecha(p.fecha_pedido)) +

        "</div>" +
        "</div>";

    html +=
        "<div class='seccion'>" +
        "<h3>📦 Productos</h3>" +
        "<div class='productos'>" +
            escapar(p.productos) +
        "</div>" +
        "</div>";

    html +=
        "<div class='seccion'>" +
        "<h3>💰 Importes</h3>" +
        "<div class='datos'>" +

            dato(
                "Subtotal productos",
                formatearDinero(
                    p.subtotal_productos
                )
            ) +

            dato(
                "Tipo de descuento",
                p.tipo_descuento
            ) +

            dato(
                "Descuento",
                formatearDinero(
                    p.descuento
                )
            ) +

            dato(
                "Total venta",
                formatearDinero(
                    p.total_venta
                )
            ) +

            dato(
                "Costo de envío",
                formatearDinero(
                    p.costo_envio
                )
            ) +

            dato(
                "TOTAL A COBRAR",
                formatearDinero(
                    p.total_a_cobrar
                )
            ) +

        "</div>" +
        "</div>";

    const estadoPagoActual = String(p.estado_pago || "PENDIENTE").toUpperCase();
    const tieneComprobante = !!String(p.comprobante_pago || "").trim();

    html +=
        "<div class='seccion'>" +
        "<h3>💳 Pago</h3>" +
        "<div class='datos'>" +
            dato("Método de pago", p.metodo_pago) +
            dato("Estado de pago", p.estado_pago) +
            dato("Fecha comprobante", formatearFecha(p.fecha_comprobante)) +
            dato("Fecha verificación", formatearFecha(p.fecha_verificacion_pago)) +
            dato("Verificado por", p.verificado_por) +
            dato("Fecha de pago", formatearFecha(p.fecha_pago)) +
            dato("Vencimiento pago", formatearFecha(p.vencimiento_pago)) +
        "</div>";

    if(tieneComprobante){
        html +=
            "<a class='btn-comprobante' href='" +
            escaparAtributoURL(p.comprobante_pago) +
            "' target='_blank' rel='noopener noreferrer'>👁 VER COMPROBANTE DE PAGO</a>";
    }

    if(estadoPagoActual === "EN VERIFICACIÓN"){
        html +=
            "<div class='control-pago' style='margin-top:12px;'>" +
                "<p class='aviso-pago'><strong>⏳ COMPROBANTE EN VERIFICACIÓN</strong><br>Revisa el archivo antes de confirmar o rechazar el pago.</p>" +
                "<div class='acciones-pago'>" +
                    "<button type='button' id='btnConfirmarPago' class='btn-confirmar-pago' onclick='confirmarPagoPedido(" +
                        JSON.stringify(String(p.id_pedido || "")) +
                    ")'>✅ CONFIRMAR PAGO</button>" +
                    "<button type='button' id='btnRechazarPago' class='btn-rechazar-pago' onclick='rechazarComprobantePedido(" +
                        JSON.stringify(String(p.id_pedido || "")) +
                    ")'>❌ RECHAZAR COMPROBANTE</button>" +
                "</div>" +
            "</div>";
    }else if(
        estadoPagoActual === "PAGO CONFIRMADO" ||
        estadoPagoActual === "PAGADO" ||
        estadoPagoActual === "CONFIRMADO"
    ){
        html +=
            "<div class='control-pago' style='margin-top:12px;background:#edf8ed;border-color:#9ac79a;'>" +
                "<p class='aviso-pago'><strong>✅ PAGO CONFIRMADO</strong><br>El pago de este pedido ya fue verificado por RHINO.</p>" +
            "</div>";
    }else{
        html +=
            "<div class='control-pago' style='margin-top:12px;'>" +
                "<p class='aviso-pago'><strong>💳 PAGO PENDIENTE</strong><br>El cliente todavía puede cargar su comprobante desde SEGUIR MI PEDIDO.</p>" +
            "</div>";
    }

    html += "</div>";

    const pedidoCancelado=String(p.estado_pedido||"").toUpperCase().includes("CANCEL");
    const pagoConfirmadoPost=["PAGO CONFIRMADO","PAGADO","CONFIRMADO"].includes(estadoPagoActual);
    const estadoDevolucion=String(p.estado_devolucion||"").toUpperCase();
    const solicitudReactivacion=String(p.solicitud_reactivacion||"").toUpperCase();
    const tieneQrDevolucion=!!String(p.qr_devolucion||"").trim();

    if(pedidoCancelado&&pagoConfirmadoPost){
        html+="<div class='seccion'><h3>↩️ Postventa: cancelación pagada</h3><div class='control-postventa'>"+
        "<p style='margin-top:0;line-height:1.5;'><strong>⚠️ Pedido cancelado después de confirmar el pago.</strong><br>El pago se conserva en el historial. Gestiona aquí la reactivación o devolución.</p>"+
        "<div class='datos'>"+dato("Estado devolución",p.estado_devolucion)+dato("Fecha solicitud devolución",formatearFecha(p.fecha_solicitud_devolucion))+dato("Fecha devolución",formatearFecha(p.fecha_devolucion))+dato("Solicitud reactivación",p.solicitud_reactivacion)+dato("Fecha solicitud reactivación",formatearFecha(p.fecha_solicitud_reactivacion))+dato("Fecha reactivación",formatearFecha(p.fecha_reactivacion))+"</div>";
        if(tieneQrDevolucion) html+="<a class='btn-comprobante' href='"+escaparAtributoURL(p.qr_devolucion)+"' target='_blank' rel='noopener noreferrer'>👁 VER QR DE DEVOLUCIÓN</a>";
        if(solicitudReactivacion==="SOLICITADA") html+="<div class='acciones-pago'><button type='button' id='btnAprobarReactivacion' class='btn-reactivar' onclick='aprobarReactivacionPedido("+JSON.stringify(String(p.id_pedido||""))+")'>🔄 APROBAR REACTIVACIÓN</button></div>";
        if(tieneQrDevolucion&&!estadoDevolucion.includes("REALIZADA")) html+="<div class='acciones-pago'><button type='button' id='btnDevolucionRealizada' class='btn-devolucion' onclick='marcarDevolucionRealizada("+JSON.stringify(String(p.id_pedido||""))+")'>💰 MARCAR DEVOLUCIÓN REALIZADA</button></div>";
        if(estadoDevolucion.includes("REALIZADA")) html+="<p style='margin:12px 0 0;'><strong>✅ DEVOLUCIÓN REALIZADA</strong></p>";
        else if(solicitudReactivacion!=="SOLICITADA"&&!tieneQrDevolucion) html+="<p style='margin:12px 0 0;'>⏳ Esperando que el cliente elija entre reactivación o devolución desde SEGUIR MI PEDIDO.</p>";
        html+="</div></div>";
    }

    html +=
        "<div class='seccion'>" +
        "<h3>🚚 Pedido y entrega</h3>" +
        "<div class='datos'>" +

            dato(
                "Estado del pedido",
                p.estado_pedido
            ) +

            dato(
                "Tipo de entrega",
                p.tipo_entrega
            ) +

            dato(
                "Transportadora",
                p.transportadora
            ) +

            dato(
                "Número de guía",
                p.numero_guia
            ) +

            dato(
                "Fecha preparación",
                formatearFecha(
                    p.fecha_preparacion
                )
            ) +

            dato(
                "Fecha envío",
                formatearFecha(
                    p.fecha_envio
                )
            ) +

            dato(
                "Fecha entrega",
                formatearFecha(
                    p.fecha_entrega
                )
            ) +

            dato(
                "Fecha cancelación",
                formatearFecha(
                    p.fecha_cancelacion
                )
            ) +

            dato(
                "Motivo cancelación",
                p.motivo_cancelacion
            ) +

        "</div>" +
        "</div>";

    html +=
        "<div class='seccion'>" +
        "<h3>⚙️ Cambiar estado del pedido</h3>" +
        "<div class='control-estado'>" +

            "<label for='nuevoEstadoPedido'>Nuevo estado</label>" +

            "<select id='nuevoEstadoPedido'>" +
                opcionEstado("PEDIDO RECIBIDO", p.estado_pedido) +
                opcionEstado("PREPARANDO", p.estado_pedido) +
                opcionEstado("ENVIADO", p.estado_pedido) +
                opcionEstado("LISTO PARA RECOGER", p.estado_pedido) +
                opcionEstado("ENTREGADO", p.estado_pedido) +
                opcionEstado("CANCELADO", p.estado_pedido) +
            "</select>" +

            "<button " +
                "type='button' " +
                "id='btnGuardarEstadoPedido' " +
                "class='btn-guardar-estado' " +
                "onclick='guardarEstadoPedido(" +
                    JSON.stringify(String(p.id_pedido || "")) +
                ")'>" +
                "💾 GUARDAR ESTADO" +
            "</button>" +

        "</div>" +
        "</div>" +

        "<div class='seccion'>" +
        "<h3>📱 Avisar al cliente</h3>" +
        "<div class='control-estado'>" +
            "<p style='margin-top:0;line-height:1.5;'>El mensaje se prepara según el estado seleccionado arriba. Puedes revisarlo en WhatsApp antes de enviarlo.</p>" +
            "<button type='button' class='btn-whatsapp' onclick='enviarAvisoWhatsApp(" +
                indice +
            ")'>📱 AVISAR AL CLIENTE POR WHATSAPP</button>" +
        "</div>" +
        "</div>";

    html +=
        "<div class='seccion'>" +

function opcionEstado(valor, estadoActual){

    const seleccionado =
        String(valor) === String(estadoActual || "")
        ? " selected"
        : "";

    return (
        "<option value='" +
        escapar(valor) +
        "'" +
        seleccionado +
        ">" +

        "</option>"
    );
}

function guardarEstadoPedido(idPedido){

    const selector =
        document.getElementById("nuevoEstadoPedido");

    const boton =
        document.getElementById("btnGuardarEstadoPedido");

    if(!selector || !idPedido){
        return;
    }

    const nuevoEstado =
        selector.value;

    const pedidoActual=pedidosCargados.find(function(item){return String(item.id_pedido||"")===String(idPedido||"");});
    const estadoPagoCancelacion=String((pedidoActual&&pedidoActual.estado_pago)||"").toUpperCase().trim();
    const pagoConfirmadoCancelacion=["PAGO CONFIRMADO","PAGADO","CONFIRMADO"].includes(estadoPagoCancelacion);

    if(nuevoEstado==="CANCELADO"&&pagoConfirmadoCancelacion){
        const totalPedido=formatearDinero(pedidoActual.total_a_cobrar);
        if(!confirm("⚠️ ATENCIÓN: ESTE PEDIDO TIENE UN PAGO CONFIRMADO.\n\nPedido: "+idPedido+"\nTotal registrado: "+totalPedido+"\n\nSi lo cancelas, el pago NO se borrará y se abrirá el proceso de REACTIVACIÓN O DEVOLUCIÓN para el cliente.\n\n¿Deseas continuar?")) return;
    }else if(!confirm("¿Guardar el estado \""+nuevoEstado+"\" para este pedido?")){
        return;
    }

    if(boton){
        boton.disabled = true;
        boton.textContent = "Guardando...";
    }

    const datos =
        new URLSearchParams();

    datos.append(
        "accion",
        "actualizarEstadoPedido"
    );

    datos.append(
        "tokenAdmin",
        sessionStorage.getItem("tokenAdmin") || ""
    );

    datos.append(
        "id_pedido",
        idPedido
    );

    datos.append(
        "estado_pedido",
        nuevoEstado
    );

    fetch(
        URL_SERVIDOR,
        {
            method:"POST",
            body:datos
        }
    )
    .then(function(respuesta){
        return respuesta.json();
    })
    .then(function(resultado){

        if(!resultado.autorizado){

            sessionStorage.removeItem(
                "tokenAdmin"
            );

            alert(
                resultado.mensaje ||
                "La sesión administrativa venció."
            );

            window.location.replace(
                "admin.html"
            );

            return;
        }

        if(!resultado.ok){
            throw new Error(
                resultado.mensaje ||
                "No se pudo actualizar el estado."
            );
        }

        alert(
            "✅ Estado actualizado correctamente:\n\n" +
            nuevoEstado
        );

        cerrarPedido();
        cargarPedidos();

    })
    .catch(function(error){

        console.error(error);

        alert(
            "❌ No se pudo actualizar el estado del pedido.\n\n" +
            error.message
        );

        if(boton){
            boton.disabled = false;
            boton.textContent = "💾 GUARDAR ESTADO";
        }
    });
}

function consultarVerificacionPolicialPedido(p){
    const contenedor=document.getElementById("controlVerificacionPolicial");
    if(!contenedor) return;
    const ci=String((p&&p.ci)||"").trim();
    if(!ci){
        contenedor.innerHTML="<p style='margin:0;'>Este pedido no tiene C.I. registrado.</p>";
        return;
    }
    const datos=new URLSearchParams();
    datos.append("accion","consultarClientePolicial");
    datos.append("ci",ci);
    fetch(URL_SERVIDOR,{method:"POST",body:datos})
    .then(function(respuesta){return respuesta.json();})
    .then(function(resultado){
        if(resultado.ok&&resultado.verificado){
            contenedor.innerHTML=
                "<p style='margin:0 0 12px;line-height:1.5;'><strong>✅ FUNCIONARIO POLICIAL VERIFICADO</strong><br>"+
                "C.I.: "+escapar(ci)+"<br>Beneficio policial activo"+
                (Number(resultado.porcentaje)>0?" · Descuento: "+escapar(resultado.porcentaje)+"%":"")+"</p>"+
                "<button type='button' class='btn-cancelar' onclick='cambiarEstadoBeneficioPolicial("+JSON.stringify(ci)+","+JSON.stringify("INACTIVO")+")'>🚫 QUITAR BENEFICIO POLICIAL</button>";
            return;
        }
        if(resultado.ok&&resultado.inactivo){
            contenedor.innerHTML=
                "<p style='margin:0 0 12px;line-height:1.5;'><strong>🚫 BENEFICIO POLICIAL INACTIVO</strong><br>Lo sentimos, por el momento el beneficio policial no está activado.</p>"+
                "<button type='button' class='btn-guardar' onclick='cambiarEstadoBeneficioPolicial("+JSON.stringify(ci)+","+JSON.stringify("VERIFICADO")+")'>♻️ REACTIVAR BENEFICIO POLICIAL</button>";
            return;
        }
        contenedor.innerHTML=
            "<p style='margin-top:0;'>Verifica la condición policial antes de registrar este C.I. como beneficiario.</p>"+
            "<button type='button' id='btnVerificarPolicia' class='btn-verificar-policia' onclick='verificarClientePolicial("+JSON.stringify(String((p&&p.id_pedido)||""))+")'>👮 VERIFICAR FUNCIONARIO POLICIAL</button>";
    })
    .catch(function(error){
        console.error(error);
        contenedor.innerHTML="<p style='margin:0;'>⚠️ No se pudo consultar la verificación policial en este momento.</p>";
    });
}

function cambiarEstadoBeneficioPolicial(ci,estado){
    const activar=String(estado||"").toUpperCase()==="VERIFICADO";
    const pregunta=activar?"¿Reactivar el beneficio policial para este cliente?":"¿Quitar el beneficio policial para este cliente? Las compras futuras ya no recibirán el descuento policial.";
    if(!confirm(pregunta)) return;
    const token=sessionStorage.getItem("tokenAdmin");
    if(!token){
        alert("La sesión administrativa venció. Inicia sesión nuevamente.");
        window.location.replace("admin.html");
        return;
    }
    const datos=new URLSearchParams();
    datos.append("accion","cambiarEstadoBeneficioPolicial");
    datos.append("tokenAdmin",token);
    datos.append("ci",String(ci||""));
    datos.append("estado",String(estado||""));
    fetch(URL_SERVIDOR,{method:"POST",body:datos})
    .then(function(respuesta){return respuesta.json();})
    .then(function(resultado){
        if(resultado.autorizado===false){
            alert(resultado.mensaje||"Sesión administrativa vencida.");
            window.location.replace("admin.html");
            return;
        }
        if(!resultado.ok){
            alert(resultado.mensaje||"No se pudo actualizar el beneficio policial.");
            return;
        }
        alert(resultado.mensaje);
        const pedidoActual=pedidosCargados.find(function(item){return String(item.ci||"").trim()===String(ci||"").trim();});
        if(pedidoActual) consultarVerificacionPolicialPedido(pedidoActual);
    })
    .catch(function(error){
        console.error(error);
        alert("No se pudo conectar con el servidor.");
    });
}

function ejecutarAccionPago(accion,idPedido,mensajeConfirmacion){
    if(!idPedido) return;
    if(!confirm(mensajeConfirmacion)) return;

    const btnConfirmar=document.getElementById("btnConfirmarPago");
    const btnRechazar=document.getElementById("btnRechazarPago");
    if(btnConfirmar) btnConfirmar.disabled=true;
    if(btnRechazar) btnRechazar.disabled=true;

    const datos=new URLSearchParams();
    datos.append("accion",accion);
    datos.append("tokenAdmin",sessionStorage.getItem("tokenAdmin") || "");
    datos.append("id_pedido",idPedido);

    fetch(URL_SERVIDOR,{method:"POST",body:datos})
    .then(function(respuesta){return respuesta.json();})
    .then(function(resultado){
        if(!resultado.autorizado){
            sessionStorage.removeItem("tokenAdmin");
            alert(resultado.mensaje || "La sesión administrativa venció.");
            window.location.replace("admin.html");
            return;
        }
        if(!resultado.ok){
            throw new Error(resultado.mensaje || "No se pudo actualizar el pago.");

        cargarPedidos();
    })

        console.error(error);
        alert("❌ " + error.message);
        if(btnConfirmar) btnConfirmar.disabled=false;
        if(btnRechazar) btnRechazar.disabled=false;
    });
}

function normalizarTelefonoWhatsApp(valor){
    let numero=String(valor||"").replace(/\D/g,"");
    if(!numero) return "";
    if(numero.startsWith("00")) numero=numero.substring(2);
    if(numero.length===8) numero="591"+numero;
    return numero;
}

function textoEstadoCliente(estado,p){
    const e=String(estado||"PEDIDO RECIBIDO").toUpperCase();
    const pago=String(p.estado_pago||"PENDIENTE").toUpperCase();

    if(e==="PEDIDO RECIBIDO"){
        if(pago==="PENDIENTE"){
            return "Hemos recibido tu pedido. El pago está pendiente. Puedes ingresar a nuestra página, abrir SEGUIR MI PEDIDO con tu código y C.I., y cargar allí tu comprobante.";
        }
        if(pago==="EN VERIFICACIÓN"){
            return "Hemos recibido tu pedido y también tu comprobante. Tu pago está EN VERIFICACIÓN. Te avisaremos cuando sea confirmado.";
        }
        return "Hemos recibido tu pedido y tu pago ya está confirmado.";
    }
    if(e==="PREPARANDO"){
        return "Tu pedido ya se encuentra EN PREPARACIÓN. Estamos alistándolo para la entrega.";
    }
    if(e==="ENVIADO"){
        return "Tu pedido ya fue ENVIADO." +
            (p.transportadora ? " Transportadora: "+p.transportadora+"." : "") +
            (p.numero_guia ? " N.º de guía: "+p.numero_guia+"." : "");
    }
    if(e==="LISTO PARA RECOGER"){
        return "Tu pedido está LISTO PARA RECOGER. Coordina la entrega según la modalidad seleccionada.";
    }
    if(e==="ENTREGADO"){
        return "Tu pedido figura como ENTREGADO. Gracias por confiar en RHINO TACTICAL ARMOR.";
    }
    if(e==="CANCELADO"){
        return "Tu pedido fue CANCELADO." +
            (p.motivo_cancelacion ? " Motivo: "+p.motivo_cancelacion+"." : "");
    }
    return "Tenemos una actualización sobre tu pedido: "+e+".";
}

function enviarAvisoWhatsApp(indice){
    const p=pedidosCargados[indice];
    if(!p){
        alert("No se pudo identificar el pedido.");
        return;
    }

    const telefono=normalizarTelefonoWhatsApp(p.telefono);
    if(!telefono){
        alert("Este pedido no tiene un número de teléfono válido.");
        return;
    }

    const selector=document.getElementById("nuevoEstadoPedido");
    const estado=selector ? selector.value : (p.estado_pedido||"PEDIDO RECIBIDO");
    const id=String(p.id_pedido||"");
    const cliente=String(p.cliente||"cliente");
    const total=formatearDinero(p.total_a_cobrar);

    let mensaje=
        "Hola "+cliente+". Somos RHINO TACTICAL ARMOR.\n\n"+
        "Pedido: *"+id+"*\n"+
        textoEstadoCliente(estado,p)+"\n\n"+
        "Estado del pago: *"+String(p.estado_pago||"PENDIENTE")+"*\n"+
        "Total: *"+total+"*";

    if(String(p.estado_pago||"").toUpperCase()==="PENDIENTE" && String(estado).toUpperCase()!=="CANCELADO"){
        mensaje += "\n\nPara enviar tu comprobante: entra a nuestra página → *SEGUIR MI PEDIDO* → ingresa *"+id+"* y tu C.I. → *CARGAR COMPROBANTE DE PAGO*.";
    }else if(String(p.estado_pago||"").toUpperCase()==="EN VERIFICACIÓN"){
        mensaje += "\n\nNo necesitas volver a cargar el comprobante mientras esté EN VERIFICACIÓN.";
    }

    mensaje += "\n\nRHINO TACTICAL ARMOR\nPROTECCIÓN · RESISTENCIA · CONFIANZA";
    window.open("https://wa.me/"+telefono+"?text="+encodeURIComponent(mensaje),"_blank","noopener");
}

function ejecutarAccionPostventa(accion,idPedido,mensajeConfirmacion){
    if(!idPedido||!confirm(mensajeConfirmacion)) return;
    const b1=document.getElementById("btnAprobarReactivacion");
    const b2=document.getElementById("btnDevolucionRealizada");
    if(b1)b1.disabled=true;
    if(b2)b2.disabled=true;

    datos.append("accion",accion);
    datos.append("tokenAdmin",sessionStorage.getItem("tokenAdmin")||"");
    datos.append("id_pedido",idPedido);
    fetch(URL_SERVIDOR,{method:"POST",body:datos})
    .then(function(r){return r.json();})
    .then(function(resultado){
        if(!resultado.autorizado){
            sessionStorage.removeItem("tokenAdmin");
            alert(resultado.mensaje||"La sesión administrativa venció.");
            window.location.replace("admin.html");
            return;
        }
        if(!resultado.ok) throw new Error(resultado.mensaje||"No se pudo completar la operación.");

        cargarPedidos();

        alert("❌ "+error.message);
        if(b1)b1.disabled=false;
        if(b2)b2.disabled=false;
    });
}

function cerrarPedido(){

    document
    .getElementById("modalPedido")
    .style.display = "none";

}

document
.getElementById("modalPedido")
.addEventListener(
    "click",
    function(event){

        if(event.target === this){
            cerrarPedido();
        }

    }
);

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){
            cerrarPedido();
        }

    }
);

cargarPedidos();
