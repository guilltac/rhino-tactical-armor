}

}
.btn-descargar{

}

    display:none;

.btn-cerrar{

}

.modal-cuerpo{

}

.seccion{

}

.seccion h3{

.datos{

}

.dato strong{

}

.productos{
    white-space:pre-line;

}


.control-estado{

.control-estado label{

}

.control-estado select{

}

.btn-guardar-estado{
    background:#315f24;
    color:white;
    width:100%;
}

}


.control-verificacion{
    background:#f6f6f6;
    border:1px solid #ddd;

}

.btn-verificar-policia{
    background:#1f4d73;

.admin-brand{display:flex;align-items:center;justify-content:center;gap:14px;}
.admin-brand img{width:88px;height:72px;object-fit:contain;}

/* AJUSTE DE ANCHO Y TABLA DE PEDIDOS */

    max-width:1580px;
    width:calc(100% - 32px);
    margin-left:auto;
    margin-right:auto;
}
.panel{

}
table{

th,td{

    align-items:center;
    flex-wrap:nowrap;
    gap:6px;
    white-space:nowrap;
}
.btn-ver,.btn-nota,.btn-descargar,.btn-whatsapp{
    padding:10px 12px;
    white-space:nowrap;
}
@media(max-width:900px){
    .container{
        width:calc(100% - 20px);
    }
    .panel{

    }
    table{

    }

</head>

<body>

<script>
if (!sessionStorage.getItem("tokenAdmin")) {
    window.location.replace("admin.html");
}
</script>

<header>
    <div class="admin-brand">
        <img src="logo-rhino.png" alt="RHINO TACTICAL ARMOR">
        <div>
            <h1>RHINO TACTICAL ARMOR</h1>
            <p>Gestión de pedidos</p>
            <small>PROTECCIÓN · RESISTENCIA · CONFIANZA</small>
        </div>
    </div>
</header>

<main class="container">

    <div class="barra">
        <a href="admin.html" class="volver">
            ← Volver al panel
        </a>

        <button
            type="button"
            class="btn-actualizar"
            onclick="cargarPedidos()"
        >
            ↻ Actualizar pedidos
        </button>
    </div>

    <div id="resumenAtencion" class="resumen-atencion"></div>

    <div class="panel">

        <div id="estadoCarga" class="estado-carga">
            Cargando pedidos...
        </div>

        <div
            id="tablaContenedor"
            class="tabla-contenedor"
            style="display:none;"
        >
            <table>
                <thead>
                    <tr>
                        <th>Pedido</th>
                        <th>Fecha</th>
                        <th>Cliente</th>
                        <th>Total</th>
                        <th>Pago</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="tablaPedidos"></tbody>
            </table>
        </div>

    </div>

</main>

<div id="modalPedido" class="modal">
    <div class="modal-contenido">

        <div class="modal-cabecera">
            <h2 id="tituloPedido">
                Detalle del pedido
            </h2>

            <button
                type="button"
                class="btn-cerrar"
                onclick="cerrarPedido()"
            >
                ✕
            </button>
        </div>

        <div
            id="detallePedido"
            class="modal-cuerpo"
        ></div>

    </div>
</div>

<script>

const URL_SERVIDOR =
"https://script.google.com/macros/s/AKfycbw5LfmoztRCz4AMONfpoPYPL8uqcalm4OrOSMXgzW0IRFccgAfXvdCIYJySEZMV94pO0g/exec";

let pedidosCargados = [];


function escapar(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){
        return "-";
    }

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function formatearFecha(valor){

    if(!valor){
        return "-";
    }

    const fecha = new Date(valor);

    if(isNaN(fecha.getTime())){
        return escapar(valor);
    }

    return fecha.toLocaleString(
        "es-BO",
        {
            dateStyle:"short",
            timeStyle:"short"
        }
    );
}


function formatearDinero(valor){

    if(
        valor === "" ||
        valor === null ||
        valor === undefined
    ){
        return "Bs 0.00";
    }

    const numero = Number(valor);

    if(isNaN(numero)){
        return "Bs " + escapar(valor);
    }

    return "Bs " + numero.toFixed(2);
}


function cargarPedidos(){

    const estadoCarga =
        document.getElementById("estadoCarga");

    const tablaContenedor =
        document.getElementById("tablaContenedor");

    estadoCarga.style.display = "block";
    estadoCarga.textContent =
        "Cargando pedidos...";

    tablaContenedor.style.display = "none";


    const datos =
        new URLSearchParams();

    datos.append(
        "accion",
        "listarPedidos"
    );

    datos.append(
        "tokenAdmin",
        sessionStorage.getItem("tokenAdmin") || ""
    );


    fetch(
        URL_SERVIDOR,
        {
            method:"POST",
            body:datos
        }
    )

    .then(function(respuesta){
        return respuesta.json();
    })

    .then(function(resultado){

        if(!resultado.autorizado){

            sessionStorage.removeItem(
                "tokenAdmin"
            );

            alert(
                resultado.mensaje ||
                "La sesión administrativa venció."
            );

            window.location.replace(
                "admin.html"
            );

            return;
        }


        if(!resultado.ok){

            throw new Error(
                resultado.mensaje ||
                "No se pudieron cargar los pedidos."
            );
        }


        pedidosCargados =
            resultado.pedidos || [];

        mostrarPedidos();

    })

    .catch(function(error){

        console.error(error);

        estadoCarga.style.display =
            "block";

        estadoCarga.textContent =
            "❌ No se pudieron cargar los pedidos.";

    });

}


function claveRevisionPedido(idPedido){
    return "rhino_revision_pedido_"+String(idPedido||"").trim().toUpperCase();
}

function fechaMilisegundos(valor){
    if(!valor) return 0;
    const fecha=new Date(valor);
    const tiempo=fecha.getTime();
    return Number.isFinite(tiempo)?tiempo:0;
}

function tieneActividadNueva(pedido){
    const id=String(pedido.id_pedido||"").trim();
    const ultima=fechaMilisegundos(pedido.ultima_actualizacion);
    if(!id||!ultima) return false;

    const guardado=Number(localStorage.getItem(claveRevisionPedido(id))||0);
    if(guardado>0) return ultima>guardado;

    const fechaPedido=fechaMilisegundos(pedido.fecha_pedido);
    return fechaPedido>0 && ultima>fechaPedido+60000;
}

function marcarPedidoRevisado(pedido){
    if(!pedido) return;
    const id=String(pedido.id_pedido||"").trim();
    if(!id) return;
    const ultima=fechaMilisegundos(pedido.ultima_actualizacion);
    localStorage.setItem(claveRevisionPedido(id),String(ultima||Date.now()));
}

function obtenerAlertaPedido(pedido){
    const estadoPedido=String(pedido.estado_pedido||"").trim().toUpperCase();
    const estadoPago=String(pedido.estado_pago||"").trim().toUpperCase();
    const devolucion=String(pedido.estado_devolucion||"").trim().toUpperCase();
    const reactivacion=String(pedido.solicitud_reactivacion||"").trim().toUpperCase();

    if(estadoPago==="EN VERIFICACIÓN"){
        return {texto:"🟠 COMPROBANTE NUEVO",clase:"alerta-comprobante"};
    }
    if(devolucion&&devolucion!=="DEVUELTO"&&devolucion!=="COMPLETADO"){
        return {texto:"💰 DEVOLUCIÓN PENDIENTE",clase:"alerta-devolucion"};
    }
    if(reactivacion&&reactivacion!=="NO"&&reactivacion!=="REACTIVADO"&&reactivacion!=="COMPLETADO"){
        return {texto:"🔄 REACTIVACIÓN PENDIENTE",clase:"alerta-reactivacion"};
    }
    const idRevision=String(pedido.id_pedido||"").trim();
    const revisionGuardada=idRevision ? Number(localStorage.getItem(claveRevisionPedido(idRevision))||0) : 0;
    const ultimaRevision=fechaMilisegundos(pedido.ultima_actualizacion);
    const yaRevisado=revisionGuardada>0 && (!ultimaRevision || revisionGuardada>=ultimaRevision);

    if((estadoPedido==="PEDIDO RECIBIDO"||!estadoPedido) && !yaRevisado){
        return {texto:"🔴 NUEVO",clase:"alerta-nuevo"};
    }
    if(tieneActividadNueva(pedido)){
        return {texto:"🔵 ACTIVIDAD NUEVA",clase:"alerta-actividad"};
    }
    return null;
}

function obtenerUrlVistaNota(url){
    const texto=String(url||"").trim();
    if(!texto) return "";
    const coincidencia=texto.match(/[?&]id=([^&]+)/);
    if(coincidencia&&coincidencia[1]) return "https://drive.google.com/file/d/"+encodeURIComponent(coincidencia[1])+"/view";
    const ruta=texto.match(/\/file\/d\/([^/]+)/);
    if(ruta&&ruta[1]) return "https://drive.google.com/file/d/"+encodeURIComponent(ruta[1])+"/view";
    return texto;
}

function verNotaVenta(url){
    const vista=obtenerUrlVistaNota(url);
    if(!vista) return;
    window.open(vista,"_blank","noopener");
}

function descargarNotaVenta(url){
    const descarga=String(url||"").trim();
    if(!descarga) return;
    window.open(descarga,"_blank","noopener");
}

function enviarMensajeClienteWhatsApp(indice,estadoForzado){
    const pedido=pedidosCargados[indice];
    if(!pedido) return;

    let telefono=String(pedido.telefono||"").replace(/[^\d]/g,"");
    if(telefono.startsWith("00")) telefono=telefono.slice(2);
    if(telefono.length===8) telefono="591"+telefono;

    if(telefono.length<10||telefono.length>15){
        alert("Revisa el teléfono del cliente en el pedido antes de abrir WhatsApp.");
        return;
    }

    const id=String(pedido.id_pedido||"").trim();
    const estado=String(estadoForzado||pedido.estado_pedido||"PEDIDO RECIBIDO").trim().toUpperCase();
    let mensaje="🦏 *RHINO TACTICAL ARMOR* 🦏\n\n";

    if(estado==="PEDIDO RECIBIDO"){
        mensaje+="Hemos recibido correctamente tu pedido *"+id+"*.\n\n"+
            "📦 Tu pedido se encuentra registrado y estamos a la espera de la confirmación correspondiente para continuar con su procesamiento.\n\n";
    }else if(estado==="PREPARANDO"){
        mensaje+="Tu pedido *"+id+"* ya se encuentra en preparación.\n\n"+
            "📦 Te avisaremos cuando esté listo para la siguiente etapa.\n\n";
    }else if(estado==="LISTO PARA RECOGER"){
        mensaje+="Tu pedido *"+id+"* ya está *LISTO PARA RECOGER*.\n\n"+
            "📦 Puedes coordinar el recojo con RHINO TACTICAL ARMOR.\n\n";
    }else if(estado==="ENVIADO"){
        mensaje+="Tu pedido *"+id+"* ha sido enviado.\n\n"+
            "🚚 Te mantendremos informado sobre su entrega.\n\n";
    }else if(estado==="ENTREGADO"){
        mensaje+="Tu pedido *"+id+"* fue entregado correctamente.\n\n";
    }else if(estado==="CANCELADO"){
        mensaje+="Tu pedido *"+id+"* figura como *CANCELADO*.\n\n"+
            "Si necesitas información adicional, puedes comunicarte con RHINO TACTICAL ARMOR.\n\n";
    }else{
        mensaje+="Información sobre tu pedido *"+id+"*.\n"+
            "📦 Estado actual: *"+estado+"*.\n\n";
    }

    mensaje+="Gracias por confiar en RHINO TACTICAL ARMOR.\n"+
        "_PROTECCIÓN · RESISTENCIA · CONFIANZA_";

    window.open("https://wa.me/"+telefono+"?text="+encodeURIComponent(mensaje),"_blank","noopener");
}


function enviarNotaWhatsApp(indice){
    const pedido=pedidosCargados[indice];
    if(!pedido) return;
    const url=String(pedido.url_nota_pdf||"").trim();
    if(!url){
        alert("Este pedido todavía no tiene una Nota de Venta disponible.");
        return;
    }
    let telefono=String(pedido.telefono||"").replace(/[^\d]/g,"");
    if(telefono.startsWith("00")) telefono=telefono.slice(2);
    if(telefono.length===8) telefono="591"+telefono;
    if(telefono.length<10||telefono.length>15){
        alert("Revisa el teléfono del cliente en el pedido antes de abrir WhatsApp.");
        return;
    }
    const numeroNota=String(pedido.numero_nota||"Nota de Venta").trim();
    const mensaje="🦏 *RHINO TACTICAL ARMOR* 🦏\n\n"+
        "Su pedido "+String(pedido.id_pedido||"")+" fue entregado correctamente.\n"+
        "Gracias por confiar en nosotros.\n\n"+
        "📄 *Descargar Nota de Venta "+numeroNota+":*\n"+url+"\n\n"+
        "_PROTECCIÓN · RESISTENCIA · CONFIANZA_";
    window.open("https://wa.me/"+telefono+"?text="+encodeURIComponent(mensaje),"_blank","noopener");
}

function mostrarPedidos(){

    const cuerpo=document.getElementById("tablaPedidos");
    const estadoCarga=document.getElementById("estadoCarga");
    const tablaContenedor=document.getElementById("tablaContenedor");
    const resumen=document.getElementById("resumenAtencion");

    cuerpo.innerHTML="";

    if(pedidosCargados.length===0){
        estadoCarga.style.display="block";
        estadoCarga.textContent="No hay pedidos registrados.";
        tablaContenedor.style.display="none";
        resumen.style.display="none";
        return;
    }

    let requierenAtencion=0;

    pedidosCargados.forEach(function(pedido,indice){
        const alerta=obtenerAlertaPedido(pedido);
        if(alerta) requierenAtencion++;

        const notaDisponible=
            String(pedido.estado_pedido||"").trim().toUpperCase()==="ENTREGADO" &&
            String(pedido.url_nota_pdf||"").trim()!=="";

        const indicador=alerta
            ?"<br><span class='alerta-pedido "+alerta.clase+"'>"+alerta.texto+"</span>"
            :"";

        let acciones=
            "<div class='acciones-rapidas'>"+
            "<button type='button' class='btn-ver' onclick='verPedido("+indice+")'>👁 Ver</button>"+
            "<button type='button' class='btn-whatsapp' onclick='enviarMensajeClienteWhatsApp("+indice+")'>📱 WhatsApp</button>";

        if(notaDisponible){
            const url=JSON.stringify(String(pedido.url_nota_pdf||""));
            acciones+=
                "<button type='button' class='btn-nota' onclick='verNotaVenta("+url+")'>📄 Ver / Imprimir</button>"+
                "<button type='button' class='btn-descargar' onclick='descargarNotaVenta("+url+")'>⬇️ Descargar</button>"+
                "<button type='button' class='btn-whatsapp' onclick='enviarNotaWhatsApp("+indice+")'>📱 Enviar nota</button>";
        }

        acciones+="</div>";

        const fila=document.createElement("tr");
        fila.innerHTML=
            "<td><strong>"+escapar(pedido.id_pedido)+"</strong>"+indicador+"</td>"+
            "<td>"+formatearFecha(pedido.fecha_pedido)+"</td>"+
            "<td>"+escapar(pedido.cliente)+"</td>"+
            "<td><strong>"+formatearDinero(pedido.total_a_cobrar)+"</strong></td>"+
            "<td><span class='estado'>"+escapar(pedido.estado_pago||"PENDIENTE")+"</span></td>"+
            "<td><span class='estado'>"+escapar(pedido.estado_pedido||"PEDIDO RECIBIDO")+"</span></td>"+
            "<td>"+acciones+"</td>";

        cuerpo.appendChild(fila);
    });

    if(requierenAtencion>0){
        resumen.style.display="block";
        resumen.textContent="⚠️ "+requierenAtencion+
            (requierenAtencion===1?" pedido requiere atención.":" pedidos requieren atención.");
    }else{
        resumen.style.display="none";
        resumen.textContent="";
    }

    estadoCarga.style.display="none";
    tablaContenedor.style.display="block";
}

function dato(titulo, valor){

    return (
        "<div class='dato'>" +
            "<strong>" +
                escapar(titulo) +
            "</strong>" +
            escapar(valor) +
        "</div>"
    );
}


function verPedido(indice){

    const p =
        pedidosCargados[indice];

    if(!p){
        return;
    }

    marcarPedidoRevisado(p);
    mostrarPedidos();

    document
    .getElementById("tituloPedido")

function opcionEstado(valor, estadoActual){

    const seleccionado =
        String(valor) === String(estadoActual || "")
        ? " selected"
        : "";

    return (
        "<option value='" +
        escapar(valor) +
        "'" +
        seleccionado +
        ">" +
        escapar(valor) +
        "</option>"
    );
}


function guardarEstadoYWhatsApp(idPedido,indice){
    const selector=document.getElementById("nuevoEstadoPedido");
    const boton=document.getElementById("btnGuardarAvisarPedido");

    if(!selector||!idPedido) return;

    const nuevoEstado=selector.value;

    if(!confirm(
        "¿Guardar el estado \""+nuevoEstado+"\" y preparar el aviso por WhatsApp para el cliente?"
    )){
        return;
    }

    if(boton){
        boton.disabled=true;
        boton.textContent="Guardando...";
    }

    const datos=new URLSearchParams();
    datos.append("accion","actualizarEstadoPedido");
    datos.append("tokenAdmin",sessionStorage.getItem("tokenAdmin")||"");
    datos.append("id_pedido",idPedido);
    datos.append("estado_pedido",nuevoEstado);

    fetch(URL_SERVIDOR,{method:"POST",body:datos})
    .then(function(respuesta){return respuesta.json();})
    .then(function(resultado){
        if(!resultado.autorizado){
            sessionStorage.removeItem("tokenAdmin");
            alert(resultado.mensaje||"La sesión administrativa venció.");
            window.location.replace("admin.html");
            return;
        }

        if(!resultado.ok){
            throw new Error(resultado.mensaje||"No se pudo actualizar el estado.");
        }

        if(pedidosCargados[indice]){
            pedidosCargados[indice].estado_pedido=nuevoEstado;
        }

        enviarMensajeClienteWhatsApp(indice,nuevoEstado);
        cerrarPedido();
        cargarPedidos();
    })
    .catch(function(error){
        console.error(error);
        alert("❌ No se pudo actualizar el estado del pedido.\n\n"+error.message);
        if(boton){
            boton.disabled=false;
            boton.textContent="📱 GUARDAR ESTADO Y AVISAR POR WHATSAPP";
        }
    });
}


function guardarEstadoPedido(idPedido){

    const selector =
        document.getElementById("nuevoEstadoPedido");

    const boton =
        document.getElementById("btnGuardarEstadoPedido");

    if(!selector || !idPedido){
        return;
    }

    const nuevoEstado =
        selector.value;

    if(!confirm(
        "¿Guardar el estado \"" +
        nuevoEstado +
        "\" para este pedido?"
    )){
        return;
    }

    if(boton){
        boton.disabled = true;
        boton.textContent = "Guardando...";
    }

    const datos =
        new URLSearchParams();

    datos.append(
        "accion",
        "actualizarEstadoPedido"
    );

    datos.append(
        "tokenAdmin",
        sessionStorage.getItem("tokenAdmin") || ""
    );

    datos.append(
        "id_pedido",
        idPedido
    );

    datos.append(
        "estado_pedido",
        nuevoEstado
    );

    fetch(
        URL_SERVIDOR,
        {
            method:"POST",
            body:datos
        }
    )
    .then(function(respuesta){
        return respuesta.json();
    })
    .then(function(resultado){

        if(!resultado.autorizado){

            sessionStorage.removeItem(
                "tokenAdmin"
            );

            alert(
                resultado.mensaje ||
                "La sesión administrativa venció."
            );

            window.location.replace(
                "admin.html"
            );

            return;
        }

        if(!resultado.ok){
            throw new Error(
                resultado.mensaje ||
                "No se pudo actualizar el estado."
            );
        }

        alert(
            "✅ Estado actualizado correctamente:\n\n" +
            nuevoEstado
        );

        cerrarPedido();
        cargarPedidos();

    })
    .catch(function(error){

        console.error(error);

        alert(
            "❌ No se pudo actualizar el estado del pedido.\n\n" +
            error.message
        );

        if(boton){
            boton.disabled = false;
            boton.textContent = "💾 GUARDAR ESTADO";
        }
    });
}

function cerrarPedido(){

    document
    .getElementById("modalPedido")
    .style.display = "none";

}

.getElementById("modalPedido")
.addEventListener(
    "click",
    function(event){

        if(event.target === this){
            cerrarPedido();
        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){
            cerrarPedido();
        }

    }
);
