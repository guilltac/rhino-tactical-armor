<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RHINO TACTICAL ARMOR - Gestionar productos</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
    color:#222;
}

header{
    background:#111;
    color:#fff;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:7px 0 0;
    color:#bbb;
}

main{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

.volver{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 16px;
    background:#222;
    color:#fff;
    text-decoration:none;
    border-radius:6px;
}

.panel{
    background:#fff;
    border-radius:10px;
    padding:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.panel-superior{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.panel-superior h2{
    margin:0;
}

.actualizar{
    border:0;
    border-radius:6px;
    padding:10px 15px;
    background:#315f24;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.producto{
    display:grid;
    grid-template-columns:80px 1fr auto;
    align-items:center;
    gap:18px;

    padding:15px 0;
    border-bottom:1px solid #ddd;
}

.producto:last-child{
    border-bottom:0;
}

.producto-imagen{
    width:75px;
    height:75px;

    border-radius:7px;
    overflow:hidden;

    background:#e5e5e5;

    display:flex;
    align-items:center;
    justify-content:center;
}

.producto-imagen img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.producto-datos h3{
    margin:0 0 7px;
}

.producto-datos p{
    margin:4px 0;
    color:#666;
    font-size:14px;
}

.acciones{
    display:flex;
    gap:8px;
}

.acciones button{
    border:0;
    border-radius:6px;
    padding:9px 12px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.editar{
    background:#315f24;
}

.eliminar{
    background:#8c2020;
}

.mensaje{
    text-align:center;
    padding:30px;
    color:#777;
}

/* CELULAR */

@media(max-width:600px){

    main{
        padding:0 12px;
        margin-top:18px;
    }

    .panel{
        padding:15px;
    }

    .panel-superior{
        align-items:flex-start;
    }

    .producto{
        grid-template-columns:60px 1fr;
        gap:10px;
    }

    .producto-imagen{
        width:58px;
        height:58px;
    }

    .acciones{
        grid-column:1 / -1;
    }

    .acciones button{
        flex:1;
    }

}
/* =========================
   EDITOR DE PRODUCTOS
========================= */

.editor-producto{
    margin-top:25px;
}

.campo{
    margin-bottom:18px;
}

.campo label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.campo input[type="text"],
.campo input[type="number"],
.campo select,
.campo textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

.campo textarea{
    min-height:100px;
    resize:vertical;
}

.categorias-editar{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(150px,1fr));
    gap:8px;
}

.categorias-editar label{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-weight:normal;
}

.categorias-editar input{
    margin-right:6px;
}

.botones-editor{
    display:flex;
    gap:10px;
}

.botones-editor button{
    border:0;
    padding:12px 18px;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.guardar-edicion{
    background:#315f24;
}

.cancelar-edicion{
    background:#555;
}

.fotos-editar{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:12px;
}
.foto-editar{
    border:1px solid #ccc;
    border-radius:8px;
    padding:10px;
    background:#fafafa;
}
.foto-editar strong{
    display:block;
    margin-bottom:8px;
}
.foto-preview{
    height:130px;
    border-radius:6px;
    background:#e5e5e5;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:8px;
}
.foto-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.foto-editar input[type="file"]{
    width:100%;
    margin-bottom:8px;
}
.eliminar-foto{
    width:100%;
    border:0;
    border-radius:6px;
    padding:8px;
    background:#8c2020;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}
.guardar-edicion:disabled{
    opacity:.6;
    cursor:not-allowed;
}

</style>

</head>

    <script>

if (!sessionStorage.getItem("tokenAdmin")) {

    window.location.replace("admin.html");

}

</script>

<body>

<header>

    <h1>RHINO TACTICAL ARMOR</h1>

    <p>Gestión de productos</p>

</header>

<main>

<a
    href="admin.html"
    class="volver"
>
    ← Volver al panel
</a>

<section class="panel">

    <div class="panel-superior">

        <h2>Productos registrados</h2>

        <button
            class="actualizar"
            onclick="cargarProductos()"
        >
            ↻ Actualizar
        </button>

    </div>

    <div id="listaProductos">

        <div class="mensaje">
            Cargando productos...
        </div>

    </div>

</section>

<!-- =========================
     EDITAR PRODUCTO
========================= -->

<section
    class="panel editor-producto"
    id="editorProducto"
    style="display:none;"
>

    <h2>✏️ Editar producto</h2>

    <input
        type="hidden"
        id="editarId"
    >

    <div class="campo">
        <label>Nombre del producto</label>

        <input
            type="text"
            id="editarNombre"
        >
    </div>

    <div class="campo">
        <label>Precio (Bs)</label>

        <input
            type="number"
            id="editarPrecio"
            min="0"
            step="0.01"
        >
    </div>

    <div class="campo">
        <label>Stock</label>

        <input
            type="number"
            id="editarStock"
            min="0"
        >
    </div>

    <div class="campo">

        <label>Estado</label>

        <select id="editarEstado">

            <option value="activo">
                Activo
            </option>

            <option value="agotado">
                Agotado
            </option>

        </select>

    </div>

    <div class="campo">

        <label>Descripción</label>

        <textarea
            id="editarDescripcion"
        ></textarea>

    </div>

    <div class="campo">
        <label>Descripción detallada</label>
        <textarea id="editarDescripcionDetallada" style="min-height:180px;"></textarea>
    </div>

    <div class="campo">
        <label>Fotografías del producto</label>
        <div class="fotos-editar">
        <div class="foto-editar">
            <strong>Foto 1 (principal)</strong>
            <div class="foto-preview" id="previewFoto">Sin foto</div>

            <button type="button" class="eliminar-foto" onclick="marcarEliminarFoto(1)">🗑️ Eliminar foto</button>
        </div>
        <div class="foto-editar">
            <strong>Foto 2</strong>
            <div class="foto-preview" id="previewFoto2">Sin foto</div>
            <input type="file" id="editarFotoArchivo2" accept="image/jpeg,image/png,image/webp" onchange="previsualizarNuevaFoto(2)">
            <button type="button" class="eliminar-foto" onclick="marcarEliminarFoto(2)">🗑️ Eliminar foto</button>
        </div>
        <div class="foto-editar">
            <strong>Foto 3</strong>
            <div class="foto-preview" id="previewFoto3">Sin foto</div>
            <input type="file" id="editarFotoArchivo3" accept="image/jpeg,image/png,image/webp" onchange="previsualizarNuevaFoto(3)">
            <button type="button" class="eliminar-foto" onclick="marcarEliminarFoto(3)">🗑️ Eliminar foto</button>
        </div>
        <div class="foto-editar">
            <strong>Foto 4</strong>
            <div class="foto-preview" id="previewFoto4">Sin foto</div>
            <input type="file" id="editarFotoArchivo4" accept="image/jpeg,image/png,image/webp" onchange="previsualizarNuevaFoto(4)">
            <button type="button" class="eliminar-foto" onclick="marcarEliminarFoto(4)">🗑️ Eliminar foto</button>
        </div>
        <div class="foto-editar">
            <strong>Foto 5</strong>
            <div class="foto-preview" id="previewFoto5">Sin foto</div>
            <input type="file" id="editarFotoArchivo5" accept="image/jpeg,image/png,image/webp" onchange="previsualizarNuevaFoto(5)">
            <button type="button" class="eliminar-foto" onclick="marcarEliminarFoto(5)">🗑️ Eliminar foto</button>
        </div>
        </div>
    </div>

    <div class="campo">

        <label>Categorías</label>

        <div class="categorias-editar">

            <label>
                <input type="checkbox"
                       value="novedades">
                Novedades
            </label>

            <label>
                <input type="checkbox"
                       value="botas">
                Botas
            </label>

            <label>
                <input type="checkbox"
                       value="tactico">
                Equipo Táctico
            </label>

            <label>
                <input type="checkbox"
                       value="uniformes">
                Uniformes
            </label>

            <label>
                <input type="checkbox"
                       value="aph">
                APH
            </label>

            <label>
                <input type="checkbox"
                       value="promo">
                Promociones
            </label>

           <label>
    <input type="checkbox"
           value="reacondicionados">
    Uniformes Reacondicionados
</label>

<label>
    <input type="checkbox"
           value="relevo">
    Zona de Relevo
</label>

<label>
    <input type="checkbox"
           value="varios">
    Varios
</label>

        </div>

    </div>

    <div class="botones-editor">

        <button
            type="button"
            class="guardar-edicion"
            id="btnGuardarEdicion"
            onclick="guardarEdicion()"
        >
            💾 Guardar cambios
        </button>

        <button
            type="button"
            class="cancelar-edicion"
            onclick="cancelarEdicion()"

        </button>

</section>
    
</main>

<script>

const URL_SERVIDOR =
"https://script.google.com/macros/s/AKfycbw5LfmoztRCz4AMONfpoPYPL8uqcalm4OrOSMXgzW0IRFccgAfXvdCIYJySEZMV94pO0g/exec";

let productos = [];
let fotosEdicionActuales=["","","","",""];
let fotosEdicionEliminadas=[false,false,false,false,false];
let guardandoEdicion=false;

/* =========================
   CARGAR PRODUCTOS
========================= */

function cargarProductos(){

    const lista =
        document.getElementById(
            "listaProductos"
        );

    lista.innerHTML =
        '<div class="mensaje">Cargando productos...</div>';

    fetch(URL_SERVIDOR)

    .then(function(respuesta){

        return respuesta.json();

    })

    .then(function(datos){

        productos = datos;

        mostrarProductos();

    })

    .catch(function(error){

        console.error(error);

        lista.innerHTML =
            '<div class="mensaje">❌ No se pudieron cargar los productos.</div>';

    });

}

/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos(){

    const lista =
        document.getElementById(
            "listaProductos"
        );

    if(!productos.length){

        lista.innerHTML =
            '<div class="mensaje">No hay productos registrados.</div>';

        return;

    }

    lista.innerHTML = "";

    productos.forEach(function(producto){

        const contenedor =
            document.createElement("div");

        contenedor.className =
            "producto";

        /* FOTO */

        let fotoHTML = "📦";

        if(producto.foto){

            let urlImagen =
                producto.foto;

            const coincidencia =
                producto.foto.match(
                    /[?&]id=([^&]+)/
                );

            if(coincidencia){

                urlImagen =
                    "https://lh3.googleusercontent.com/d/" +
                    coincidencia[1];

            }

            fotoHTML =
                '<img src="' +
                urlImagen +
                '" alt="">';

        }

        contenedor.innerHTML =

            '<div class="producto-imagen">' +
                fotoHTML +
            '</div>' +

            '<div class="producto-datos">' +

                '<h3>' +
                    escapar(producto.nombre) +
                '</h3>' +

                '<p><strong>Precio:</strong> Bs ' +
                    escapar(producto.precio) +
                '</p>' +

                '<p><strong>Stock:</strong> ' +
                    escapar(producto.stock) +
                '</p>' +

                '<p><strong>Estado:</strong> ' +
                    escapar(producto.estado) +
                '</p>' +

            '</div>' +

            '<div class="acciones">' +

                '<button class="editar" onclick="editarProducto(\'' +
                    String(producto.id) +
                '\')">' +
                    '✏️ Editar' +
                '</button>' +

                '<button class="eliminar" onclick="eliminarProducto(\'' +
                    String(producto.id) +
                '\')">' +
                    '🗑️ Eliminar' +
                '</button>' +

            '</div>';

        lista.appendChild(
            contenedor
        );

    });

}

/* =========================
   SEGURIDAD DE TEXTO
========================= */

function escapar(valor){

    const div =
        document.createElement("div");

    div.textContent =
        valor == null
        ? ""
        : String(valor);

    return div.innerHTML;

}

/* =========================
   BOTONES
   Los activaremos después
========================= */

function urlVisibleDrive(url){
    const valor=String(url||"");
    const coincidencia=valor.match(/[?&]id=([^&]+)/);
    return coincidencia
        ? "https://lh3.googleusercontent.com/d/"+coincidencia[1]
        : valor;
}

function actualizarPreviewFoto(numero,url){
    const sufijo=numero===1?"":String(numero);
    const preview=document.getElementById("previewFoto"+sufijo);
    if(!preview)return;
    if(url){
        preview.innerHTML='<img src="'+escapar(urlVisibleDrive(url))+'" alt="Foto '+numero+'">';
    }else{
        preview.textContent="Sin foto";
    }
}

function editarProducto(id){
    const producto=productos.find(function(p){
        return String(p.id)===String(id);
    });
    if(!producto){
        alert("No se encontró el producto.");
        return;
    }

    document.getElementById("editarId").value=producto.id;
    document.getElementById("editarNombre").value=producto.nombre||"";
    document.getElementById("editarPrecio").value=producto.precio||"";
    document.getElementById("editarStock").value=producto.stock||"";
    document.getElementById("editarEstado").value=producto.estado||"activo";
    document.getElementById("editarDescripcion").value=producto.descripcion||"";
    document.getElementById("editarDescripcionDetallada").value=producto.descripcionDetallada||"";

    fotosEdicionActuales=[
        producto.foto||"",
        producto.foto2||"",
        producto.foto3||"",
        producto.foto4||"",
        producto.foto5||""
    ];
    fotosEdicionEliminadas=[false,false,false,false,false];

    for(let i=1;i<=5;i++){
        const sufijo=i===1?"":String(i);
        const input=document.getElementById("editarFotoArchivo"+sufijo);
        if(input)input.value="";
        actualizarPreviewFoto(i,fotosEdicionActuales[i-1]);
    }

    const categoriasProducto=String(producto.categorias||"")
        .split(",")
        .map(function(categoria){return categoria.trim();});

    document.querySelectorAll(".categorias-editar input[type='checkbox']")
        .forEach(function(caja){
            caja.checked=categoriasProducto.includes(caja.value);
        });

    const editor=document.getElementById("editorProducto");
    editor.style.display="block";
    editor.scrollIntoView({behavior:"smooth",block:"start"});
}

function previsualizarNuevaFoto(numero){
    const sufijo=numero===1?"":String(numero);
    const input=document.getElementById("editarFotoArchivo"+sufijo);
    if(!input||!input.files||!input.files[0])return;
    const archivo=input.files[0];
    if(!["image/jpeg","image/png","image/webp"].includes(archivo.type)){
        alert("La foto debe ser JPG, PNG o WEBP.");
        input.value="";
        return;
    }
    fotosEdicionEliminadas[numero-1]=false;
    const lector=new FileReader();
    lector.onload=function(e){
        actualizarPreviewFoto(numero,e.target.result);
    };
    lector.readAsDataURL(archivo);
}

function marcarEliminarFoto(numero){
    const sufijo=numero===1?"":String(numero);
    const input=document.getElementById("editarFotoArchivo"+sufijo);
    if(input)input.value="";
    fotosEdicionEliminadas[numero-1]=true;
    actualizarPreviewFoto(numero,"");
}

function archivoABase64(archivo){
    return new Promise(function(resolve,reject){
        const lector=new FileReader();
        lector.onload=function(){
            const resultado=String(lector.result||"");
            resolve(resultado.indexOf(",")>=0?resultado.split(",")[1]:resultado);
        };
        lector.onerror=function(){reject(new Error("No se pudo leer la imagen."));};
        lector.readAsDataURL(archivo);
    });
}

async function subirFotoEdicion(archivo){
    const base64=await archivoABase64(archivo);
    const cuerpo=new URLSearchParams();
    cuerpo.append("accion","subirImagen");
    cuerpo.append("base64",base64);
    cuerpo.append("tipoArchivo",archivo.type||"image/jpeg");
    cuerpo.append("nombreArchivo",archivo.name||"imagen.jpg");
    cuerpo.append("tokenAdmin",sessionStorage.getItem("tokenAdmin")||"");

    const respuesta=await fetch(URL_SERVIDOR,{method:"POST",body:cuerpo});
    const texto=await respuesta.text();
    let datos;
    try{
        datos=JSON.parse(texto);
    }catch(error){
        throw new Error("El servidor no devolvió una respuesta válida al subir la fotografía.");
    }
    if(datos.autorizado===false){
        sessionStorage.removeItem("tokenAdmin");
        window.location.replace("admin.html");
        throw new Error("La sesión administrativa venció.");
    }
    if(!datos.ok||!datos.url){
        throw new Error(datos.mensaje||"No se pudo subir la fotografía.");
    }
    return datos.url;
}

function eliminarProducto(id){

    const producto =
        productos.find(function(p){

            return String(p.id) === String(id);

        });

    if(!producto){

        alert("No se encontró el producto.");
        return;

    }

    const confirmar =
        confirm(
            "¿Está seguro de eliminar este producto?\n\n" +
            producto.nombre +
            "\n\nEsta acción eliminará el producto de la tienda."
        );

    if(!confirmar){

        return;

    }

    const formulario =
        document.createElement("form");

    formulario.method = "POST";
    formulario.action = URL_SERVIDOR;
    formulario.target = "iframeEliminar";
    formulario.style.display = "none";

    const accion =
        document.createElement("input");

    accion.type = "hidden";
    accion.name = "accion";
    accion.value = "eliminarProducto";

    const campoId =
        document.createElement("input");

    campoId.type = "hidden";
    campoId.name = "id";
    campoId.value = id;

    const campoToken =
    document.createElement("input");

campoToken.type = "hidden";
campoToken.name = "tokenAdmin";
campoToken.value =
    sessionStorage.getItem("tokenAdmin") || "";

    formulario.appendChild(accion);
    formulario.appendChild(campoId);
    formulario.appendChild(campoToken);

    let iframe =
        document.getElementById("iframeEliminar");

    if(!iframe){

        iframe =
            document.createElement("iframe");

        iframe.name = "iframeEliminar";
        iframe.id = "iframeEliminar";
        iframe.style.display = "none";

        document.body.appendChild(iframe);

    }

    document.body.appendChild(formulario);

    formulario.submit();

    alert("✅ Producto eliminado correctamente.");

    setTimeout(function(){

        formulario.remove();

        cargarProductos();

    }, 1500);

}

function cancelarEdicion(){
    if(guardandoEdicion)return;
    document.getElementById("editorProducto").style.display="none";
}

async function guardarEdicion(){
    if(guardandoEdicion)return;

    const id=document.getElementById("editarId").value;
    const nombre=document.getElementById("editarNombre").value.trim();
    const precio=document.getElementById("editarPrecio").value;
    const stock=document.getElementById("editarStock").value;
    const estado=document.getElementById("editarEstado").value;
    const descripcion=document.getElementById("editarDescripcion").value.trim();
    const descripcionDetallada=document.getElementById("editarDescripcionDetallada").value.trim();

    if(!nombre){
        alert("Escribe el nombre del producto.");
        return;
    }

    const categorias=[];
    document.querySelectorAll(".categorias-editar input[type='checkbox']:checked")
        .forEach(function(caja){categorias.push(caja.value);});

    const boton=document.getElementById("btnGuardarEdicion");
    guardandoEdicion=true;
    boton.disabled=true;
    boton.textContent="⏳ Guardando cambios...";

    try{
        const fotosFinales=fotosEdicionActuales.slice();

        for(let i=1;i<=5;i++){
            const sufijo=i===1?"":String(i);
            const input=document.getElementById("editarFotoArchivo"+sufijo);
            if(input&&input.files&&input.files[0]){
                boton.textContent="⏳ Subiendo foto "+i+"...";
                fotosFinales[i-1]=await subirFotoEdicion(input.files[0]);
            }else if(fotosEdicionEliminadas[i-1]){
                fotosFinales[i-1]="";
            }
        }

        boton.textContent="⏳ Guardando producto...";

        const cuerpo=new URLSearchParams();
        cuerpo.append("accion","editarProducto");
        cuerpo.append("id",id);
        cuerpo.append("nombre",nombre);
        cuerpo.append("precio",precio);
        cuerpo.append("stock",stock);
        cuerpo.append("descripcion",descripcion);
        cuerpo.append("descripcionDetallada",descripcionDetallada);
        cuerpo.append("categorias",categorias.join(","));
        cuerpo.append("estado",estado);
        cuerpo.append("tokenAdmin",sessionStorage.getItem("tokenAdmin")||"");
        cuerpo.append("foto",fotosFinales[0]);
        cuerpo.append("foto2",fotosFinales[1]);
        cuerpo.append("foto3",fotosFinales[2]);
        cuerpo.append("foto4",fotosFinales[3]);
        cuerpo.append("foto5",fotosFinales[4]);

        const respuesta=await fetch(URL_SERVIDOR,{method:"POST",body:cuerpo});
        const texto=await respuesta.text();
        let resultado;
        try{
            resultado=JSON.parse(texto);
        }catch(error){
            throw new Error("El servidor recibió la solicitud, pero no devolvió una confirmación válida. No vuelvas a pulsar Guardar; primero verifica la planilla.");
        }

        if(resultado.autorizado===false){
            sessionStorage.removeItem("tokenAdmin");
            window.location.replace("admin.html");
            return;
        }
        if(!resultado.ok){
            throw new Error(resultado.mensaje||"No se pudo actualizar el producto.");
        }

        alert("✅ Producto actualizado correctamente.");
        document.getElementById("editorProducto").style.display="none";
        await cargarProductos();
    }catch(error){
        alert("❌ "+(error.message||String(error)));
    }finally{
        guardandoEdicion=false;
        boton.disabled=false;
        boton.textContent="💾 Guardar cambios";
    }
}

/* CARGAR AL ABRIR */

cargarProductos();

</script>
