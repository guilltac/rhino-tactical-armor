<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RHINO TACTICAL ARMOR - Gestionar productos</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f2f2f2;
    color:#222;
}

header{
    background:#111;
    color:#fff;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:25px;
}

header p{
    margin:7px 0 0;
    color:#bbb;
}

main{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

.volver{
    display:inline-block;
    margin-bottom:20px;
    padding:10px 16px;
    background:#222;
    color:#fff;
    text-decoration:none;
    border-radius:6px;
}

.panel{
    background:#fff;
    border-radius:10px;
    padding:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.panel-superior{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.panel-superior h2{
    margin:0;
}

.actualizar{
    border:0;
    border-radius:6px;
    padding:10px 15px;
    background:#315f24;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.producto{
    display:grid;
    grid-template-columns:80px 1fr auto;
    align-items:center;
    gap:18px;

    padding:15px 0;
    border-bottom:1px solid #ddd;
}

.producto:last-child{
    border-bottom:0;
}

.producto-imagen{
    width:75px;
    height:75px;

    border-radius:7px;
    overflow:hidden;

    background:#e5e5e5;

    display:flex;
    align-items:center;
    justify-content:center;
}

.producto-imagen img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.producto-datos h3{
    margin:0 0 7px;
}

.producto-datos p{
    margin:4px 0;
    color:#666;
    font-size:14px;
}

.acciones{
    display:flex;
    gap:8px;
}

.acciones button{
    border:0;
    border-radius:6px;
    padding:9px 12px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.editar{
    background:#315f24;
}

.eliminar{
    background:#8c2020;
}

.mensaje{
    text-align:center;
    padding:30px;
    color:#777;
}


/* CELULAR */

@media(max-width:600px){

    main{
        padding:0 12px;
        margin-top:18px;
    }

    .panel{
        padding:15px;
    }

    .panel-superior{
        align-items:flex-start;
    }

    .producto{
        grid-template-columns:60px 1fr;
        gap:10px;
    }

    .producto-imagen{
        width:58px;
        height:58px;
    }

    .acciones{
        grid-column:1 / -1;
    }

    .acciones button{
        flex:1;
    }

}
/* =========================
   EDITOR DE PRODUCTOS
========================= */

.editor-producto{
    margin-top:25px;
}

.campo{
    margin-bottom:18px;
}

.campo label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
}

.campo input[type="text"],
.campo input[type="number"],
.campo select,
.campo textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:15px;
}

.campo textarea{
    min-height:100px;
    resize:vertical;
}

.categorias-editar{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(150px,1fr));
    gap:8px;
}

.categorias-editar label{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-weight:normal;
}

.categorias-editar input{
    margin-right:6px;
}

.botones-editor{
    display:flex;
    gap:10px;
}

.botones-editor button{
    border:0;
    padding:12px 18px;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.guardar-edicion{
    background:#315f24;
}

.cancelar-edicion{
    background:#555;
}
</style>

</head>


<body>

<header>

    <h1>RHINO TACTICAL ARMOR</h1>

    <p>Gestión de productos</p>

</header>


<main>

<a
    href="admin.html"
    class="volver"
>
    ← Volver al panel
</a>


<section class="panel">

    <div class="panel-superior">

        <h2>Productos registrados</h2>

        <button
            class="actualizar"
            onclick="cargarProductos()"
        >
            ↻ Actualizar
        </button>

    </div>


    <div id="listaProductos">

        <div class="mensaje">
            Cargando productos...
        </div>

    </div>

</section>

<!-- =========================
     EDITAR PRODUCTO
========================= -->

<section
    class="panel editor-producto"
    id="editorProducto"
    style="display:none;"
>

    <h2>✏️ Editar producto</h2>

    <input
        type="hidden"
        id="editarId"
    >


    <div class="campo">
        <label>Nombre del producto</label>

        <input
            type="text"
            id="editarNombre"
        >
    </div>


    <div class="campo">
        <label>Precio (Bs)</label>

        <input
            type="number"
            id="editarPrecio"
            min="0"
            step="0.01"
        >
    </div>


    <div class="campo">
        <label>Stock</label>

        <input
            type="number"
            id="editarStock"
            min="0"
        >
    </div>


    <div class="campo">

        <label>Estado</label>

        <select id="editarEstado">

            <option value="activo">
                Activo
            </option>

            <option value="agotado">
                Agotado
            </option>

        </select>

    </div>


    <div class="campo">

        <label>Descripción</label>

        <textarea
            id="editarDescripcion"
        ></textarea>

    </div>


    <div class="campo">

        <label>Categorías</label>

        <div class="categorias-editar">

            <label>
                <input type="checkbox"
                       value="novedades">
                Novedades
            </label>

            <label>
                <input type="checkbox"
                       value="botas">
                Botas
            </label>

            <label>
                <input type="checkbox"
                       value="tactico">
                Equipo Táctico
            </label>

            <label>
                <input type="checkbox"
                       value="uniformes">
                Uniformes
            </label>

            <label>
                <input type="checkbox"
                       value="aph">
                APH
            </label>

            <label>
                <input type="checkbox"
                       value="promo">
                Promociones
            </label>

           <label>
    <input type="checkbox"
           value="reacondicionados">
    Uniformes Reacondicionados
</label>

<label>
    <input type="checkbox"
           value="relevo">
    Zona de Relevo
</label>

<label>
    <input type="checkbox"
           value="varios">
    Varios
</label>

        </div>

    </div>


    <div class="botones-editor">

        <button
            type="button"
            class="guardar-edicion"
            onclick="guardarEdicion()"
        >
            💾 Guardar cambios
        </button>

        <button
            type="button"
            class="cancelar-edicion"
            onclick="cancelarEdicion()"
        >
            Cancelar
        </button>

    </div>

</section>
    
</main>


<script>

const URL_SERVIDOR =
"https://script.google.com/macros/s/AKfycbw5LfmoztRCz4AMONfpoPYPL8uqcalm4OrOSMXgzW0IRFccgAfXvdCIYJySEZMV94pO0g/exec";


let productos = [];


/* =========================
   CARGAR PRODUCTOS
========================= */

function cargarProductos(){

    const lista =
        document.getElementById(
            "listaProductos"
        );

    lista.innerHTML =
        '<div class="mensaje">Cargando productos...</div>';


    fetch(URL_SERVIDOR)

    .then(function(respuesta){

        return respuesta.json();

    })

    .then(function(datos){

        productos = datos;

        mostrarProductos();

    })

    .catch(function(error){

        console.error(error);

        lista.innerHTML =
            '<div class="mensaje">❌ No se pudieron cargar los productos.</div>';

    });

}


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos(){

    const lista =
        document.getElementById(
            "listaProductos"
        );


    if(!productos.length){

        lista.innerHTML =
            '<div class="mensaje">No hay productos registrados.</div>';

        return;

    }


    lista.innerHTML = "";


    productos.forEach(function(producto){

        const contenedor =
            document.createElement("div");

        contenedor.className =
            "producto";


        /* FOTO */

        let fotoHTML = "📦";

        if(producto.foto){

            let urlImagen =
                producto.foto;

            const coincidencia =
                producto.foto.match(
                    /[?&]id=([^&]+)/
                );

            if(coincidencia){

                urlImagen =
                    "https://lh3.googleusercontent.com/d/" +
                    coincidencia[1];

            }

            fotoHTML =
                '<img src="' +
                urlImagen +
                '" alt="">';

        }


        contenedor.innerHTML =

            '<div class="producto-imagen">' +
                fotoHTML +
            '</div>' +

            '<div class="producto-datos">' +

                '<h3>' +
                    escapar(producto.nombre) +
                '</h3>' +

                '<p><strong>Precio:</strong> Bs ' +
                    escapar(producto.precio) +
                '</p>' +

                '<p><strong>Stock:</strong> ' +
                    escapar(producto.stock) +
                '</p>' +

                '<p><strong>Estado:</strong> ' +
                    escapar(producto.estado) +
                '</p>' +

            '</div>' +

            '<div class="acciones">' +

                '<button class="editar" onclick="editarProducto(\'' +
                    String(producto.id) +
                '\')">' +
                    '✏️ Editar' +
                '</button>' +

                '<button class="eliminar" onclick="eliminarProducto(\'' +
                    String(producto.id) +
                '\')">' +
                    '🗑️ Eliminar' +
                '</button>' +

            '</div>';


        lista.appendChild(
            contenedor
        );

    });

}


/* =========================
   SEGURIDAD DE TEXTO
========================= */

function escapar(valor){

    const div =
        document.createElement("div");

    div.textContent =
        valor == null
        ? ""
        : String(valor);

    return div.innerHTML;

}


/* =========================
   BOTONES
   Los activaremos después
========================= */

function editarProducto(id){

    const producto =
        productos.find(function(p){

            return String(p.id) === String(id);

        });


    if(!producto){

        alert(
            "No se encontró el producto."
        );

        return;

    }


    /* ID */

    document
        .getElementById("editarId")
        .value =
        producto.id;


    /* NOMBRE */

    document
        .getElementById("editarNombre")
        .value =
        producto.nombre || "";


    /* PRECIO */

    document
        .getElementById("editarPrecio")
        .value =
        producto.precio || "";


    /* STOCK */

    document
        .getElementById("editarStock")
        .value =
        producto.stock || "";


    /* ESTADO */

    document
        .getElementById("editarEstado")
        .value =
        producto.estado || "activo";


    /* DESCRIPCIÓN */

    document
        .getElementById("editarDescripcion")
        .value =
        producto.descripcion || "";


    /* CATEGORÍAS */

    const categoriasProducto =
        String(
            producto.categorias || ""
        )
        .split(",")
        .map(function(categoria){

            return categoria.trim();

        });


    document
        .querySelectorAll(
            ".categorias-editar input[type='checkbox']"
        )
        .forEach(function(caja){

            caja.checked =
                categoriasProducto.includes(
                    caja.value
                );

        });


    /* MOSTRAR EDITOR */

    const editor =
        document.getElementById(
            "editorProducto"
        );

    editor.style.display =
        "block";


    /* BAJAR AUTOMÁTICAMENTE
       HASTA EL FORMULARIO */

    editor.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}

function eliminarProducto(id){

    const producto =
        productos.find(function(p){

            return String(p.id) === String(id);

        });


    if(!producto){

        alert("No se encontró el producto.");
        return;

    }


    const confirmar =
        confirm(
            "¿Está seguro de eliminar este producto?\n\n" +
            producto.nombre +
            "\n\nEsta acción eliminará el producto de la tienda."
        );


    if(!confirmar){

        return;

    }


    const formulario =
        document.createElement("form");

    formulario.method = "POST";
    formulario.action = URL_SERVIDOR;
    formulario.target = "iframeEliminar";
    formulario.style.display = "none";


    const accion =
        document.createElement("input");

    accion.type = "hidden";
    accion.name = "accion";
    accion.value = "eliminarProducto";


    const campoId =
        document.createElement("input");

    campoId.type = "hidden";
    campoId.name = "id";
    campoId.value = id;

    const campoToken =
    document.createElement("input");

campoToken.type = "hidden";
campoToken.name = "tokenAdmin";
campoToken.value =
    sessionStorage.getItem("tokenAdmin") || "";

    formulario.appendChild(accion);
    formulario.appendChild(campoId);
    formulario.appendChild(campoToken);


    let iframe =
        document.getElementById("iframeEliminar");


    if(!iframe){

        iframe =
            document.createElement("iframe");

        iframe.name = "iframeEliminar";
        iframe.id = "iframeEliminar";
        iframe.style.display = "none";

        document.body.appendChild(iframe);

    }


    document.body.appendChild(formulario);

    formulario.submit();


    alert("✅ Producto eliminado correctamente.");


    setTimeout(function(){

        formulario.remove();

        cargarProductos();

    }, 1500);

}

function cancelarEdicion(){

    document
        .getElementById(
            "editorProducto"
        )
        .style.display =
        "none";

}


function guardarEdicion(){

    const id =
        document.getElementById("editarId").value;

    const nombre =
        document.getElementById("editarNombre").value.trim();

    const precio =
        document.getElementById("editarPrecio").value;

    const stock =
        document.getElementById("editarStock").value;

    const estado =
        document.getElementById("editarEstado").value;

    const descripcion =
        document.getElementById("editarDescripcion").value.trim();


    if(!nombre){

        alert("Escribe el nombre del producto.");
        return;

    }


    const categorias = [];

    document
        .querySelectorAll(
            ".categorias-editar input[type='checkbox']:checked"
        )
        .forEach(function(caja){

            categorias.push(caja.value);

        });


    const formulario =
        document.createElement("form");

    formulario.method = "POST";
    formulario.action = URL_SERVIDOR;
    formulario.target = "iframeEdicion";
    formulario.style.display = "none";


    const datos = {

        accion: "editarProducto",
        id: id,
        nombre: nombre,
        precio: precio,
        stock: stock,
        descripcion: descripcion,
        categorias: categorias.join(","),
        estado: estado

    };


    Object.keys(datos).forEach(function(clave){

        const input =
            document.createElement("input");

        input.type = "hidden";
        input.name = clave;
        input.value = datos[clave];

        formulario.appendChild(input);

    });


    let iframe =
        document.getElementById("iframeEdicion");


    if(!iframe){

        iframe =
            document.createElement("iframe");

        iframe.name = "iframeEdicion";
        iframe.id = "iframeEdicion";
        iframe.style.display = "none";

        document.body.appendChild(iframe);

    }


    document.body.appendChild(formulario);

    formulario.submit();


    alert("✅ Cambios enviados correctamente.");


    setTimeout(function(){

        formulario.remove();

        cancelarEdicion();

        cargarProductos();

    }, 1500);

}

/* CARGAR AL ABRIR */

cargarProductos();

</script>

</body>

</html>
